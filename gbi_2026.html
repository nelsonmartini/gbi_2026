<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garland Bend Invitational 2026</title>

<!-- Favicon & PWA -->
<link rel="icon" type="image/jpeg" href="gbi-logo.jpg">
<link rel="apple-touch-icon" href="gbi-logo.jpg">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GBI 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

<!-- Open Graph — controls preview image when link is shared -->
<meta property="og:title" content="Garland Bend Invitational 2026">
<meta property="og:description" content="Live scoring, team standings, and hole payouts for GBI 2026.">

<meta property="og:url" content="https://nelsonmartini.github.io/gbi_2026/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://nelsonmartini.github.io/gbi_2026/gbi-logo.jpg">
<style>
:root {
  --green: #006747;
  --green-dark: #004d35;
  --green-mid: #005a3d;
  --green-light: #e8f4ef;
  --gold: #C9A84C;
  --gold-light: #f0d98a;
  --gold-dark: #9a7a2e;
  --cream: #f7f3eb;
  --cream-dark: #ede7d8;
  --white: #ffffff;
  --dark: #1a1a1a;
  --gray: #666;
  --gray-light: #999;
  --border: #ddd;
  --t1: #1a4a8a;
  --t2: #7a1a1a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Georgia, 'Times New Roman', serif;
  background: var(--cream);
  color: var(--dark);
  min-height: 100vh;
  font-size: 15px;
}

/* ─── HEADER ─── */
.site-header {
  background: var(--green);
  color: var(--white);
  text-align: center;
  padding: 18px 20px 14px;
  border-bottom: 5px solid var(--gold);
  position: relative;
}
.site-header .year-tag {
  position: absolute; top: 18px; right: 24px;
  background: var(--gold); color: var(--green-dark);
  font-size: 1em; font-weight: bold;
  padding: 4px 12px; border-radius: 20px; letter-spacing: 1px;
}
.conn-status {
  position: absolute; top: 20px; left: 20px;
  font-size: .78em; color: rgba(255,255,255,.5);
  letter-spacing: .5px;
}
.update-badge {
  position: absolute; top: 40px; left: 20px;
  font-size: .72em; font-weight: bold; letter-spacing: .4px;
  background: var(--gold); color: var(--green-dark);
  padding: 3px 10px; border-radius: 12px; cursor: pointer;
  display: none; white-space: nowrap;
}
.update-badge:hover { opacity: .85; }
.site-logo-wrap {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: var(--white);
  border: 3px solid var(--gold);
  box-shadow: 0 3px 12px rgba(0,0,0,.35);
  overflow: hidden;
  margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
}
.site-logo-wrap img {
  width: 88%; height: 88%;
  object-fit: contain;
  display: block;
}
.site-header h1 {
  font-size: 2em; letter-spacing: 3px;
  color: var(--gold); text-shadow: 1px 2px 4px rgba(0,0,0,.4);
  margin-bottom: 4px;
}
.site-header .subtitle {
  font-size: .9em; color: rgba(255,255,255,.75); font-style: italic;
}
.site-header .gbi-abbr {
  font-size: .8em; color: var(--gold-light); letter-spacing: 2px; margin-top: 2px;
}

/* ─── NAV TABS ─── */
.tab-nav {
  background: var(--green-dark);
  display: flex; overflow-x: auto;
  border-bottom: 3px solid var(--gold);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: pan-x;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 11px 18px;
  background: none; border: none; border-bottom: 3px solid transparent;
  margin-bottom: -3px;
  color: rgba(255,255,255,.65);
  cursor: pointer; font-family: Georgia, serif; font-size: .9em;
  white-space: nowrap; transition: color .2s, border-color .2s;
  scroll-snap-align: start;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
.tab-btn:hover { color: var(--gold-light); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(255,255,255,.07); }

/* ─── MOBILE HAMBURGER NAV — phone-width screens only ─── */
.mobile-nav-bar {
  display: none; align-items: center; gap: 12px;
  background: var(--green-dark); padding: 11px 16px;
  border-bottom: 3px solid var(--gold);
}
.hamburger-btn {
  background: none; border: none; color: var(--gold);
  font-size: 1.5em; cursor: pointer; padding: 0 4px; line-height: 1;
}
.current-tab-label {
  color: var(--gold-light); font-family: Georgia, serif;
  font-weight: bold; font-size: .95em; letter-spacing: .3px;
}
.mobile-nav-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 55; }
.mobile-nav-backdrop.show { display: block; }
@media (max-width: 720px) {
  .mobile-nav-bar { display: flex; }
  .tab-nav {
    display: none; position: fixed; top: 49px; left: 0; z-index: 60;
    flex-direction: column; width: 230px; max-height: calc(100vh - 49px);
    overflow-y: auto; border-bottom: none; border-right: 3px solid var(--gold);
    box-shadow: 4px 0 24px rgba(0,0,0,.45);
  }
  .tab-nav.mobile-open { display: flex; }
  .tab-nav .tab-btn {
    width: 100%; text-align: left; padding: 13px 18px;
    border-bottom: 1px solid rgba(255,255,255,.1); border-left: 3px solid transparent;
    margin-bottom: 0; scroll-snap-align: none;
  }
  .tab-nav .tab-btn.active { border-left-color: var(--gold); background: rgba(255,255,255,.09); }
}

/* ─── CONTENT AREA ─── */
.tab-pane { display: none; padding: 22px 20px; max-width: 1260px; margin: 0 auto; }
.tab-pane.active { display: block; }

/* ─── CARDS ─── */
.card {
  background: var(--white); border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.09);
  margin-bottom: 18px; overflow: hidden;
}
.card-header {
  background: var(--green); color: var(--white);
  padding: 11px 16px; font-size: 1em; font-weight: bold;
  letter-spacing: .5px; display: flex; align-items: center;
  justify-content: space-between; gap: 8px;
}
.card-header .badge-gold { color: var(--gold); }
.card-body { padding: 16px; }
.card-subheader {
  background: var(--green-light); padding: 8px 16px;
  font-size: .85em; color: var(--green-dark); font-weight: bold;
  letter-spacing: .3px; border-bottom: 1px solid var(--border);
}

/* ─── TABLES ─── */
table { width: 100%; border-collapse: collapse; font-size: .88em; }
thead th {
  background: var(--green); color: var(--gold);
  padding: 9px 11px; text-align: left; font-size: .82em;
  letter-spacing: .4px; white-space: nowrap;
  position: sticky; top: 0; z-index: 5;
}
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
th.c, td.c { text-align: center; }
tbody tr:nth-child(even) { background: #f8f5f0; }
tbody tr:hover { background: #edf5f0; }
td { padding: 8px 11px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
.sb-table td { padding: 8px 6px; }
.sb-table th { padding-left: 6px; padding-right: 6px; }

/* ─── RANK BADGES ─── */
.rank {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--green); color: var(--white);
  font-size: .8em; font-weight: bold;
}
.rank.gold { background: var(--gold); color: var(--white); }

/* ─── TEAM BADGES ─── */
.tb {
  display: inline-block; padding: 3px 9px; border-radius: 12px;
  font-size: .76em; font-weight: bold; color: var(--white);
  white-space: nowrap;
}
.tb-none { background: #888; }

/* ─── MATCHUP BLOCK ─── */
.matchup {
  display: grid; grid-template-columns: 1fr 52px 1fr;
  gap: 16px; align-items: center; text-align: center;
  padding: 16px 0;
}
.team-block {
  background: var(--green); color: var(--white);
  border-radius: 12px; padding: 18px 12px;
}
.team-block.leading { border: 3px solid var(--gold); }
.t-name { font-size: 1.1em; color: var(--gold); font-weight: bold; margin-bottom: 6px; }
.t-pts { font-size: 2.8em; font-weight: bold; line-height: 1; }
.t-sub { font-size: .78em; color: rgba(255,255,255,.65); margin-top: 6px; }
.vs-mid { font-size: 1.8em; font-weight: bold; color: var(--green); font-style: italic; }

/* ─── ALERTS ─── */
.alert {
  padding: 11px 15px; border-radius: 6px;
  margin-bottom: 14px; font-size: .88em; line-height: 1.5;
}
.alert-gold { background: #fff8e1; border-left: 4px solid var(--gold); color: #5a420a; }
.alert-green { background: var(--green-light); border-left: 4px solid var(--green); color: var(--green-dark); }
.alert-info { background: #e3f1fb; border-left: 4px solid #1976d2; color: #0d3d6e; }
.alert-red { background: #fdeaea; border-left: 4px solid #c0392b; color: #6e1a12; }

/* ─── FORMS ─── */
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
label { font-size: .8em; color: var(--gray); font-weight: bold; letter-spacing: .3px; }
input[type="text"], input[type="number"], select {
  padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 5px; font-family: Georgia, serif; font-size: .9em;
  background: var(--white); transition: border-color .2s;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus {
  outline: none; border-color: var(--green);
  box-shadow: 0 0 0 2px rgba(0,103,71,.12);
}
input.score-in { width: 80px; text-align: center; }

/* ─── BUTTONS ─── */
.btn {
  padding: 8px 16px; border: none; border-radius: 5px;
  cursor: pointer; font-family: Georgia, serif;
  font-size: .88em; font-weight: bold; transition: all .18s;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn-green { background: var(--green); color: var(--white); }
.btn-green:hover { background: var(--green-dark); }
.btn-gold { background: var(--gold); color: var(--white); }
.btn-gold:hover { background: var(--gold-dark); }
.btn-red { background: #c0392b; color: var(--white); }
.btn-red:hover { background: #a02820; }
.btn-sm { padding: 4px 10px; font-size: .78em; }
.btn-xs { padding: 3px 8px; font-size: .72em; }

/* ─── PLAYER CHIPS ─── */
.chip-pool {
  display: flex; flex-wrap: wrap; gap: 7px;
  padding: 11px; background: #f2ede3;
  border-radius: 7px; min-height: 52px;
  border: 2px dashed #ccc;
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 16px;
  background: var(--white); border: 2px solid var(--border);
  font-size: .85em; cursor: pointer;
  transition: all .18s; user-select: none; white-space: nowrap;
}
.chip:hover { border-color: var(--green); }
.chip.t1 { background: #e8f0fb; border-color: var(--t1); color: var(--t1); }
.chip.t2 { background: #fbe8e8; border-color: var(--t2); color: var(--t2); }

/* ─── GROUP / MATCH PANELS ─── */
.gpanel {
  border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 12px; overflow: hidden;
}
.gpanel-head {
  background: var(--green); color: var(--white);
  padding: 8px 12px;
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 8px;
  border-bottom: 2px solid var(--green-dark); font-weight: bold; font-size: .88em;
  font-family: 'Cinzel', Georgia, serif; letter-spacing: .3px;
}
.gpanel-head-mid {
  text-align: center; font-size: .8em; color: var(--gold-light);
  font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gpanel-head-right {
  display: flex; align-items: center; font-size: .8em;
  color: rgba(255,255,255,.65); font-weight: normal; white-space: nowrap;
}
.gpanel-head-right input {
  background: rgba(0,0,0,.2); border-color: rgba(255,255,255,.2);
  color: rgba(255,255,255,.85);
}
.gpanel-body { padding: 8px; }
.gpanel select { font-size: .78em; padding: 4px 5px; }
.gpanel label  { font-size: .72em; }
/* 4-man 2×2 + score box layout */
.group-layout {
  display: grid; grid-template-columns: 1fr 1fr 88px;
  gap: 8px; align-items: stretch;
}
.group-col { display: flex; flex-direction: column; gap: 6px; }
.group-col .form-group { gap: 2px; }
.group-score-box {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 5px;
  background: #f2ede3; border-radius: 6px;
  border: 2px solid var(--border); padding: 8px; text-align: center;
}
.group-score-box label { font-size: .72em; color: var(--gray); font-weight: bold; margin: 0; letter-spacing: .3px; }
.group-score-box input { width: 62px; font-size: 1.15em; text-align: center; }
.match-sides {
  display: grid; grid-template-columns: 1fr 44px 1fr;
  gap: 14px; align-items: start;
}
.side-t1 { background: #edf2fb; padding: 11px; border-radius: 7px; border: 2px solid rgba(26,74,138,.25); }
.side-t2 { background: #fbedee; padding: 11px; border-radius: 7px; border: 2px solid rgba(122,26,26,.25); }
.side-label { font-weight: bold; margin-bottom: 8px; font-size: .9em; }
.vs-center { display: flex; align-items: center; justify-content: center; font-size: 1.4em; font-weight: bold; color: var(--green); font-style: italic; padding-top: 30px; }

/* ─── PAYOUT CATEGORY COLORS ─── */
.cat { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .75em; font-weight: bold; }
.cat-LD  { background: #fde8e8; color: #b03030; }
.cat-C2P { background: #e8f0fd; color: #2060a0; }
.cat-LP  { background: #f0e8fd; color: #7030a0; }
.cat-NP  { background: #f0f0f0; color: #888; }

/* ─── COLOR HELPERS ─── */
.green  { color: var(--green); }
.gold   { color: var(--gold-dark); }
.money  { color: #1a7a1a; font-weight: bold; }
.pts    { color: var(--green); font-weight: bold; }
.hi     { color: var(--gold-dark); font-weight: bold; }

/* ─── SECTION HEADER ─── */
.sec-head {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 0 12px; padding-bottom: 7px;
  border-bottom: 2px solid var(--green);
}
.sec-head h3 { font-size: 1.1em; color: var(--green-dark); }

/* ─── STAT BOXES ─── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 14px; }
.stat-box {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
}
.stat-box .slabel { font-size: .72em; color: var(--gray); margin-bottom: 3px; }
.stat-box .sval { font-size: 1.5em; font-weight: bold; color: var(--green); }
.stat-box .ssub { font-size: .75em; color: var(--gray-light); }

/* ─── FORMAT TABLE ─── */
.fmt-table { width: 100%; border-collapse: collapse; font-size: .87em; margin-top: 6px; }
.fmt-table th { background: var(--green); color: var(--gold); padding: 7px 11px; text-align: left; }
.fmt-table td { padding: 7px 11px; border-bottom: 1px solid var(--border); }
.fmt-table tbody tr:last-child td { border-bottom: none; }

/* ─── TWO-COL LAYOUT ─── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* ─── WINNER ROW ─── */
tr.winner td:first-child { border-left: 3px solid var(--gold); }
tr.winner { background: #fffce8 !important; }

/* ─── SAVE TOAST ─── */
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--green); color: var(--white);
  padding: 9px 18px; border-radius: 20px; font-size: .83em;
  opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none;
}
#toast.show { opacity: 1; }

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center; padding: 32px 20px;
  color: var(--gray-light); font-style: italic;
}
.empty .eicon { font-size: 2.4em; margin-bottom: 8px; }

/* ─── RESPONSIVE ─── */
@media (max-width: 720px) {
  .two-col, .three-col { grid-template-columns: 1fr; }
  .matchup { grid-template-columns: 1fr; }
  .vs-mid { display: none; }
  .match-sides { grid-template-columns: 1fr; }
  .vs-center { display: none; }
  .site-header h1 { font-size: 1.4em; }
  .hide-mobile { display: none !important; }
  /* tighter tables on mobile */
  table { font-size: .78em; }
  td, th { padding: 5px 5px; }
  thead th { font-size: .72em; letter-spacing: 0; }
  /* hide day-results breakdown cols on mobile — total tells the story */
  .hide-phone { display: none !important; }
  .tab-pane { padding: 12px 10px; }
}

/* ─── SEARCH HIGHLIGHT ─── */
.player-result-card {
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 12px;
}
.player-result-head {
  padding: 10px 14px; color: var(--white); font-weight: bold;
  display: flex; align-items: center; justify-content: space-between;
}
.player-result-body { padding: 12px 14px; }

/* progress bar */
.prog-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin: 4px 0; }
.prog-fill { height: 100%; border-radius: 3px; transition: width .4s; }

/* ─── COMPACT TEAM BANNER ─── */
.team-compact-banner {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 8px; margin-bottom: 14px; align-items: stretch;
}
.tcb-side {
  border-radius: 8px; padding: 12px 16px; text-align: center; color: white;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.tcb-name  { font-size: .8em; letter-spacing: .5px; opacity: .8; margin-bottom: 4px; }
.tcb-score { font-size: 2em; font-weight: bold; line-height: 1; }
.tcb-mid   { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0 4px; }
.tcb-vs    { font-weight: bold; color: var(--green-dark); font-size: 1em; }
.tcb-margin { font-size: .68em; color: var(--gray); font-style: italic; text-align: center; line-height: 1.3; }

/* ─── BIG BOARD ─── */
.big-board {
  background: #f7f4ec; border: 3px solid #1a3a1a;
  border-radius: 4px; overflow: hidden;
  font-family: 'Cinzel', Georgia, serif;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
}
.bb-title-bar {
  background: var(--gold); padding: 13px 20px; text-align: center;
  border-bottom: 3px solid #1a3a1a;
}
.bb-tournament { color: #1a3a1a; font-size: 1.1em; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; }
.bb-year       { color: rgba(0,0,0,.45); font-size: .72em; letter-spacing: 3px; margin-top: 3px; }
.bb-cols {
  display: grid; grid-template-columns: 52px 1fr 72px 72px;
  padding: 7px 16px; background: var(--green);
  border-bottom: 2px solid #1a3a1a;
  font-size: .68em; color: rgba(255,255,255,.85);
  letter-spacing: 1.5px; text-transform: uppercase;
}
.bb-cols .c { text-align: center; }
.bb-row {
  display: grid; grid-template-columns: 52px 1fr 72px 72px;
  align-items: center; padding: 10px 16px;
  border-bottom: 1px solid #d4c9a8;
}
.bb-row:nth-child(even) { background: #f0ece0; }
.bb-row.bb-top { background: #fdf8e8 !important; border-left: 4px solid var(--gold); }
.bb-pos      { font-size: .85em; color: #666; }
.bb-pos.bb-gold { color: var(--gold-dark); font-weight: 700; }
.bb-name     { font-size: .9em; font-weight: 600; color: #111; padding-left: 10px; border-left: 4px solid transparent; }
.bb-pts      { font-size: 1.5em; font-weight: 900; text-align: center; color: #111; font-family: 'Cinzel', Georgia, serif; line-height: 1; }
.bb-par      { font-size: .8em; text-align: center; line-height: 1.3; }
.bb-par.under { color: #cc0000; font-weight: 700; }
.bb-par.even  { color: #222; font-weight: 600; }
.bb-par.over  { color: #888; }
.bb-par.none  { color: #ccc; }
.bb-view-btn { display: flex; justify-content: flex-end; margin-bottom: 12px; }
@media(max-width:520px) {
  .bb-cols, .bb-row { grid-template-columns: 38px 1fr 60px 60px; padding-left: 10px; padding-right: 10px; }
}

/* ─── MATCH ARENA (2v2 redesign) ─── */
.match-arena {
  display: grid; grid-template-columns: 1fr 38px 1fr;
}

function ratingKey(name) { return name.replace(/[.#$/\[\]]/g, '_'); }

  return { skill: r.skill ?? null, vibes: r.vibes ?? null, grade: r.grade ?? null };
}

async function signInAnon() {
  if (!_auth) return;
  // Anonymous sessions carry no meaningful identity worth persisting across loads —
  // skipping IndexedDB/localStorage-backed persistence avoids a known Firebase/Safari
  // quirk ("attempt to get records from database without an in-progress transaction")
  // that IndexedDB-based auth persistence can throw, especially after backgrounding
  // the tab or clearing site data. Re-authenticating fresh each load is instant anyway.
  try { await _auth.setPersistence('none'); } catch(e) { console.warn('setPersistence failed:', e); }
  try { await _auth.signInAnonymously(); }
  catch(e) { console.warn('Anonymous sign-in failed:', e); }
}

// Always rebuild roster from the current PLAYERS array so renames take effect
// immediately, while preserving any existing team assignments by matching names.
function applyRoster(loaded) {
  const teamMap = {};
  (loaded.roster || []).forEach(p => { if (p.name) teamMap[p.name] = p.team; });
  // Only 't1'/'t2' are ever valid — anything else (corrupted data, a stray value from
  // an old bug, manual edits) silently heals back to unassigned instead of crashing
  // every render that touches that player's team badge.
  loaded.roster = PLAYERS.map(n => {
    const t = teamMap[n];
    return { name: n, team: (t === 't1' || t === 't2') ? t : null };
  });
  return loaded;
}

async function boot() {
  initFB();

  if (fbReady()) {
    document.getElementById('pane-scoreboard').innerHTML =
      '<div style="text-align:center;padding:80px 20px;color:#888">' +
      '<div style="font-size:2.4em;margin-bottom:14px">🔄</div>' +
      'Connecting to live scoreboard…</div>';

    // If PIN is already verified this session, sign in immediately.
    // Otherwise signInAnon() is called by submitPin() after PIN entry.
    if (checkPin()) signInAnon();

    // All data loading is gated on auth — no auth token = no data access.
    _auth.onAuthStateChanged(async user => {
      if (!user) return;   // wait until signed in
      try {
        const snap = await _ref.once('value');
        if (snap.exists()) {
          S = applyRoster({ ...defaultState(), ...snap.val() });
        }
        // If snap doesn't exist, leave S as the in-memory defaultState() and do NOT
        // write it to Firebase. A transient/false-negative read here must never be
        // allowed to overwrite real shared data — Firebase only gets written to from
        // an explicit user action via save().

        _ref.on('value', snap => {
          try {
            if (!snap.exists()) return;
            const d = snap.val();
            if (d._cid === CLIENT_ID) return;
            S = applyRoster({ ...defaultState(), ...d });
            render(_cur);
            updateTabLockBadges();
            if (S.draft?.active) startDraftTimer();
          } catch(e) {
            showErrorBanner('⚠️ LIVE SYNC ERROR: ' + (e.message || e) + (e.stack ? ('\n' + e.stack.split('\n').slice(0,3).join('\n')) : ''));
          }
        }, e => {
          showErrorBanner('⚠️ LIVE LISTENER FAILED (likely a permissions/auth issue): ' + (e.code || '') + ' ' + (e.message || e));
        });

        firebase.database().ref('.info/connected').on('value', snap => setConnStatus(!!snap.val()));
        _dataLoaded = true;
        render(_cur);
        updateTabLockBadges();
        if (S.draft?.active) startDraftTimer();
      } catch(e) {
        console.warn('Firebase load failed, falling back to localStorage:', e);
        showErrorBanner('⚠️ COULD NOT LOAD FROM FIREBASE (using local copy instead): ' + (e.code || '') + ' ' + (e.message || e));
        try { const r = localStorage.getItem('gbi2026v1'); if (r) S = JSON.parse(r); } catch(_) {}
        setConnStatus(false);
        _dataLoaded = true;
        render(_cur);
        updateTabLockBadges();
        if (S.draft?.active) startDraftTimer();
      }
    });
  } else {
    // No Firebase config — localStorage only
    try { const r = localStorage.getItem('gbi2026v1'); if (r) S = JSON.parse(r); } catch(_) {}
    setConnStatus(false);
    _dataLoaded = true;
    render(_cur);

  }
}

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
// Returns 1-based rank per score (lower score = better). Tied scores share
// the same rank (the top position of the tied block, e.g. two ties at 1st
// both get rank 1, the next unique score gets rank 3).
function rank(scores) {
  return scores.map((s, _, arr) => {
    if (s === '' || s === null) return null;
    const v = parseFloat(s);
    if (isNaN(v)) return null;
    const better = arr.filter(x => x !== '' && x !== null && !isNaN(parseFloat(x)) && parseFloat(x) < v).length;
    return better + 1;
  });
}

// Points for myRank, averaging across all tied positions in the table.
// e.g. two tied at rank 1 in a [8,6,4,2,1] table → (8+6)/2 = 7 each.
function rankedPts(table, allRanks, myRank) {
  if (myRank === null) return 0;
  const tiedCount = allRanks.filter(r => r === myRank).length;
  let total = 0;
  for (let i = myRank - 1; i < myRank - 1 + tiedCount && i < table.length; i++) {
    total += table[i];
  }
  return tiedCount > 0 ? total / tiedCount : 0;
}

// Ordinal suffix: 1 → "1st", 2 → "2nd", etc.
function ordinal(n) {
  if (n === null) return '—';
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function fourManPoints(day) {
  const scores = S[day].groups.map(g => g.score);
  const ranks  = rank(scores);
  return ranks.map(r => r === null ? null : rankedPts(SC[day].fourMan, ranks, r));
}

function matchResults(day) {
  const matches = S[day].matches;
  const sc = SC[day];
  const allScores = [];
  matches.forEach(m => { allScores.push(m.score1); allScores.push(m.score2); });
  const ranks = rank(allScores);

  return matches.map((m, i) => {
    const s1 = m.score1, s2 = m.score2;
    const r1 = ranks[i*2], r2 = ranks[i*2+1];
    let w1 = 0, w2 = 0;
    if (s1 !== '' && s2 !== '' && s1 !== null && s2 !== null && !isNaN(parseFloat(s1)) && !isNaN(parseFloat(s2))) {
      const v1 = parseFloat(s1), v2 = parseFloat(s2);
      if (v1 < v2)      { w1 = sc.matchWin; }
      else if (v2 < v1) { w2 = sc.matchWin; }
      else              { w1 = sc.matchTie; w2 = sc.matchTie; }
    }
    const rk1 = rankedPts(sc.matchRank, ranks, r1);
    const rk2 = rankedPts(sc.matchRank, ranks, r2);
    return {
      p1: { rank: r1, win: w1, rankPts: rk1, total: w1 + rk1 },
      p2: { rank: r2, win: w2, rankPts: rk2, total: w2 + rk2 }
    };
  });
}

function playerStats(name) {
  const st = { name, team: teamOf(name),
    d1: { fourMan:0, matchWin:0, matchRank:0, payout:0, total:0, money:0 },
    d2: { fourMan:0, matchWin:0, matchRank:0, payout:0, total:0, money:0 },
    total:0, money:0 };

  ['day1','day2'].forEach(day => {
    const dk = day === 'day1' ? 'd1' : 'd2';
    const fmPts = fourManPoints(day);
    S[day].groups.forEach((g,gi) => {
      if (g.players.includes(name)) st[dk].fourMan = fmPts[gi] || 0;
    });
    const mrs = matchResults(day);
    S[day].matches.forEach((m,mi) => {
      const r = mrs[mi];
      if ([m.p1a, m.p1b].includes(name)) { st[dk].matchWin = r.p1.win; st[dk].matchRank = r.p1.rankPts; }
      if ([m.p2a, m.p2b].includes(name)) { st[dk].matchWin = r.p2.win; st[dk].matchRank = r.p2.rankPts; }
    });
    S[day].payouts.forEach(p => {
      if (p.cat !== 'NP' && p.winner === name) {
        st[dk].payout += SC.payoutPts;
        st[dk].money  += SC.payoutMoney;
      }
    });
    st[dk].total = st[dk].fourMan + st[dk].matchWin + st[dk].matchRank + st[dk].payout;
  });
  st.total = st.d1.total + st.d2.total;
  st.money = st.d1.money + st.d2.money;
  return st;
}

function calcOdds() {
  const AVG_SKILL = 7.1, AVG_RANK = 10.5, AVG_VIBES = 7.4;
  function raw(name) {
    const m = PLAYER_META[name];
    const r = rating(name);
    const skill = r.skill !== null ? r.skill : AVG_SKILL;
    const vibes = r.vibes !== null ? r.vibes : AVG_VIBES;
    const rank25 = m.prev ? m.prev.rank : AVG_RANK;
    const s = skill * 0.6 + (21 - rank25) * 0.5 * 0.3 + vibes * 0.1;
    return s * s;
  }
  const raws = {}; let total = 0;
  PLAYERS.forEach(n => { raws[n] = raw(n); total += raws[n]; });
  const result = {};
  PLAYERS.forEach(n => {
    const p = raws[n] / total;
    const o = (1 - p) / p;
    let num = o < 10 ? Math.round(o) : o < 25 ? Math.round(o / 2) * 2 : o < 60 ? Math.round(o / 5) * 5 : Math.round(o / 10) * 10;
    result[n] = `${num}/1`;
  });
  return result;
}

function allPlayerStats() {
  return PLAYERS.map(n => playerStats(n)).sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
}

function teamTotals() {
  let r = { t1: {name:S.teams.t1.name, d1:0, d2:0, total:0}, t2: {name:S.teams.t2.name, d1:0, d2:0, total:0} };
  S.roster.forEach(p => {
    if (p.team !== 't1' && p.team !== 't2') return;
    const s = playerStats(p.name);
    r[p.team].d1    += s.d1.total;
    r[p.team].d2    += s.d2.total;
    r[p.team].total += s.total;
  });
  return r;
}

function teamOf(name) {
  const p = S.roster.find(r => r.name === name);

}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Relative luminance of a hex color, 0 (black) - 1 (white)
function hexLum(hex) {
  const h = String(hex || '').replace('#','');
  if (h.length !== 6) return 0;
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
// Legible text color to put ON TOP of a team-color background (e.g. white team -> black text)
function contrastColor(hex) { return hexLum(hex) > 0.6 ? '#161616' : '#fff'; }
// Legible version of a team color when it's used AS text/fill on the site's light cream background
function safeTeamColor(hex) { return hexLum(hex) > 0.85 ? '#161616' : hex; }

// Returns {set: bottom-5 names, last: dead-last name} when scores exist
function ppPlayers() {
  const all = allPlayerStats();
  if (!all.some(p => p.total > 0)) return { set: new Set(), lastSet: new Set(), last: null };
  const sorted = [...all].sort((a,b) => a.total - b.total);
  // Bottom 5 by position, but ties at that boundary expand the group — nobody tied
  // with the nominal 5th-worst score gets unfairly left out.
  const thresholdScore = sorted[Math.min(4, sorted.length - 1)].total;
  const bottomGroup = sorted.filter(p => p.total <= thresholdScore);
  // Same logic for "last place" — if multiple players are tied for dead last,
  // all of them are equally in last place, not just whichever sorted first.
  const minScore = sorted[0].total;
  const lastSet = new Set(sorted.filter(p => p.total === minScore).map(p => p.name));
  return { set: new Set(bottomGroup.map(p => p.name)), lastSet, last: sorted[0].name };
}
// 🍆 for dead last, ⚠️ for the other bottom 4
function ppBadge(name, pp) {
  if (!pp || !pp.set.has(name)) return '';
  return ` <span style="font-size:.78em">${pp.lastSet.has(name) ? '&#127814;' : '&#9888;&#65039;'}</span>`;
}
// Red DM Mono pts for PP Zone players, normal green otherwise
function ppPts(name, pp, val) {
  if (pp && pp.set.has(name))
    return `<strong style="color:#8b1a1a;font-family:'DM Mono',monospace">${fmt(val)}</strong>`;
  return `<strong class="pts">${fmt(val)}</strong>`;
}
function flag(name) {
  const f = name === 'Trevor' ? '🇪🇬' : '🇺🇸';
  return `<span style="font-size:.65em;vertical-align:middle">${f}</span>`;
}
function jsq(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function fmt(n) {
  if (n === null || n === undefined || n === '') return '—';
  const v = parseFloat(n);
  if (isNaN(v)) return '—';
  return v % 1 === 0 ? String(v) : v.toFixed(1);
}
function fmtM(n) { return n ? `$${n}` : '$0'; }

function tBadge(team) {
  const t = team ? S.teams[team] : null;

function playerScoreToPar(name) {
  let total = 0, count = 0;
  ['day1','day2'].forEach(day => {
    S[day].groups.forEach(g => {
      if (g.players.includes(name) && g.score !== '' && !isNaN(parseFloat(g.score))) {
        total += parseFloat(g.score); count++;
      }
    });
    S[day].matches.forEach(m => {
      if ([m.p1a,m.p1b].includes(name) && m.score1 !== '' && !isNaN(parseFloat(m.score1))) {
        total += parseFloat(m.score1); count++;
      }
      if ([m.p2a,m.p2b].includes(name) && m.score2 !== '' && !isNaN(parseFloat(m.score2))) {
        total += parseFloat(m.score2); count++;
      }
    });
  });
  return count > 0 ? total : null;
}

function fmtPar(n) {
  if (n === null) return '—';
  if (n === 0) return 'E';
  return (n > 0 ? '+' : '') + n;
}

function setDraftCat(cat) {
  _draftCat = cat;
  renderRoster();
}

function draftSnakeTeam(pickIdx) {
  const round = Math.floor(pickIdx / 2);
  return (round % 2 === 0) ? (pickIdx % 2 === 0 ? 't1' : 't2') : (pickIdx % 2 === 0 ? 't2' : 't1');
}

function startDraft() {
  const t1 = esc(S.teams.t1.name), t2 = esc(S.teams.t2.name);
  if (!confirm(`Start the GBI 2026 Draft?\n\n${t1} picks first. Snake order. Commissioner controls all 20 picks.\n\nThis will clear current team assignments.`)) return;
  S.roster.forEach(p => p.team = null);
  S.draft = { active: true, complete: false, picks: [], currentPick: 0, timerStart: Date.now(), timerDuration: 180 };
  save();
  renderRoster();
  startDraftTimer();
}

function makePick(playerName) {
  if (!S.draft?.active || S.draft.complete) return;
  const pickIdx = S.draft.currentPick;
  const team = draftSnakeTeam(pickIdx);
  const rp = S.roster.find(r => r.name === playerName);
  if (rp) rp.team = team;
  S.draft.picks.push({ pick: pickIdx + 1, team, player: playerName });
  S.draft.currentPick++;
  if (S.draft.currentPick >= 20) {
    S.draft.complete = true;
    S.draft.active = false;
    clearInterval(_draftTimer); _draftTimer = null;
  } else {
    S.draft.timerStart = Date.now();
  }
  save();
  renderRoster();
  if (S.draft?.active) startDraftTimer();
}

function resetDraft() {
  const pin = prompt('Enter commissioner PIN to reset draft:');
  if (!pin || pin.trim().toUpperCase() !== ADMIN_PIN.toUpperCase()) { alert('Incorrect PIN.'); return; }
  if (!confirm('Reset the draft? All team assignments will be cleared.')) return;
  S.roster.forEach(p => p.team = null);
  S.draft = { active: false, complete: false, picks: [], currentPick: 0, timerStart: null, timerDuration: 180, paused: false, pausedRemaining: null };
  save();
  clearInterval(_draftTimer); _draftTimer = null;
  renderRoster();
}

function pauseDraft() {
  if (!S.draft?.active || S.draft.paused) return;
  const elapsed = Math.floor((Date.now() - (S.draft.timerStart || Date.now())) / 1000);
  S.draft.pausedRemaining = Math.max(0, (S.draft.timerDuration || 180) - elapsed);
  S.draft.paused = true;
  clearInterval(_draftTimer); _draftTimer = null;
  save();
  renderRoster();
}

function resumeDraft() {
  if (!S.draft?.active || !S.draft.paused) return;
  const remaining = S.draft.pausedRemaining ?? S.draft.timerDuration;
  S.draft.timerStart = Date.now() - ((S.draft.timerDuration - remaining) * 1000);
  S.draft.paused = false;
  S.draft.pausedRemaining = null;
  save();
  renderRoster();
  startDraftTimer();
}

function startDraftTimer() {
  if (_draftTimer) { clearInterval(_draftTimer); _draftTimer = null; }
  if (!S.draft?.active || S.draft.paused) return;
  _draftTimer = setInterval(() => {
    if (!S.draft?.active || S.draft.paused) { clearInterval(_draftTimer); _draftTimer = null; return; }
    const elapsed = Math.floor((Date.now() - (S.draft.timerStart || Date.now())) / 1000);
    const left = Math.max(0, (S.draft.timerDuration || 180) - elapsed);
    const el = document.getElementById('draft-timer-display');
    if (el) {
      el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
      if (left === 0) {
        el.style.color = '#ff4444';
        el.style.animation = 'draftFlash .6s infinite';
      } else {
        el.style.animation = '';
        el.style.color = left <= 20 ? '#fbbf24' : 'white';
      }
    }
  }, 500);
}

function buildDraftBoard(draft) {
  if (!draft.picks?.length) return '<div style="color:#aaa;font-size:.85em;padding:8px 0">No picks yet.</div>';
  const rows = draft.picks.map(pk => {
    const tc = S.teams[pk.team]?.color || '#888';
    const tn = esc(S.teams[pk.team]?.name || pk.team);
    return `<tr>
      <td class="c" style="font-size:.82em;color:#888;width:32px">${pk.pick}</td>
      <td style="padding:4px 8px"><span class="tb" style="background:${tc};color:${contrastColor(tc)};font-size:.76em">${tn}</span></td>
      <td style="font-size:.88em"><strong>${flag(pk.player)} ${esc(pk.player)}</strong></td>
    </tr>`;
  }).join('');
  return `<table style="width:100%;border-collapse:collapse;margin-top:8px">${rows}</table>`;
}

  const headText = contrastColor(tColor);

  const ovStrong = onLight ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.25)';
  const ovWeak = onLight ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.15)';
  const ovBorderStrong = onLight ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.5)';
  const ovBorderWeak = onLight ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.4)';
  const nextTeam = pickIdx + 1 < 20 ? draftSnakeTeam(pickIdx + 1) : null;
  const draftedNames = new Set((draft.picks || []).map(p => p.player));

  // Big Screen Mode — bigger fonts, less clutter, for projecting on a TV
  const bs = _draftBigScreen;
  const bsz = {
    pickLabel: bs ? '1.05em' : '.72em',
    onClock:   bs ? '2.4em'  : '1.15em',
    nextLabel: bs ? '1.05em' : '.75em',
    timer:     bs ? '4.8em'  : '2.2em',
    cardPad:   bs ? '18px'   : '10px',
    name:      bs ? '1.3em'  : '.9em',
    rank25:    bs ? '.9em'   : '.72em',
    avatar:    bs ? '76px'   : '40px',
    btnFont:   bs ? '1.15em' : '1em',
    btnPad:    bs ? '14px 0' : '6px 0',
    gridMin:   bs ? '230px'  : '155px',
    gridGap:   bs ? '16px'   : '8px',
    catLabel:  bs ? '1.3em'  : '1em',
    catSub:    bs ? '.95em'  : '.75em',
  };
  const available = [...PLAYERS]
    .filter(n => !draftedNames.has(n))
    .filter(n => !_draftCat || PLAYER_META[n].cat === _draftCat)
    .sort((a, b) => (PLAYER_META[b].skill || 0) - (PLAYER_META[a].skill || 0));

  const playerCards = available.map(name => {
    const m = PLAYER_META[name];
    const gc = gradeColor[m.grade] || '#888';
    const rank25 = m.prev ? `#${m.prev.rank} '25` : '&#127381; Rookie';
    return `<div class="dp-card">
      <div class="dp-name">${flag(name)} <strong>${esc(name)}</strong>${ppChampBadge(name)}<br><span style="font-size:.72em;color:#888">${rank25}</span></div>
      <div class="dp-stats">
        <span title="Skill">&#9889; ${m.skill ?? '—'}</span>
        <span title="Vibes">&#10024; ${m.vibes ?? '—'}</span>
        <span style="background:${gc};color:white;border-radius:4px;padding:1px 5px">${m.grade ?? '—'}</span>
        <span style="color:var(--green)">${odds[name]}</span>
      </div>
      <button class="dp-pick-btn" style="background:${esc(tColor)};color:${headText};border:${onLight ? '2px solid #161616' : 'none'};width:100%;letter-spacing:.08em" onclick="makePick('${jsq(name)}')">
        DRAFT
      </button>
    </div>`;
  }).join('');

  const nextLabel = nextTeam ? `Up next: <strong>${esc(S.teams[nextTeam].name)}</strong>` : '';

  return `<div style="text-align:right;margin-bottom:8px">
    <button class="btn btn-sm" onclick="_draftBigScreen=!_draftBigScreen;renderRoster()">${bs ? '&#128241; Normal View' : '&#128250; Big Screen Mode'}</button>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="draft-header" style="background:${esc(tColor)};color:${headText};padding:${bs?'22px 28px':'14px 18px'}">
      <div>
        <div style="font-size:${bsz.pickLabel};opacity:.85;text-transform:uppercase;letter-spacing:.06em">Pick ${pickIdx + 1} of 20</div>
        <div style="font-size:${bsz.onClock};font-weight:bold;font-family:'Cinzel',serif">${tName} ON THE CLOCK</div>
        <div style="font-size:${bsz.nextLabel};opacity:.75;margin-top:2px">${nextLabel}</div>
      </div>
      <div style="text-align:right">
        <div id="draft-timer-display" style="font-size:${bsz.timer};font-weight:bold;font-family:'Cinzel',serif;color:${headText}">${S.draft.paused ? `${Math.floor((S.draft.pausedRemaining||0)/60)}:${String((S.draft.pausedRemaining||0)%60).padStart(2,'0')}` : '3:00'}</div>
        <div style="margin-top:4px">
          ${S.draft.paused
            ? `<button onclick="resumeDraft()" style="background:${ovStrong};border:1px solid ${ovBorderStrong};color:${headText};border-radius:8px;padding:4px 14px;cursor:pointer;font-size:.8em;font-weight:bold">▶ Resume</button>`
            : `<button onclick="pauseDraft()" style="background:${ovWeak};border:1px solid ${ovBorderWeak};color:${headText};border-radius:8px;padding:4px 14px;cursor:pointer;font-size:.8em">⏸ Pause</button>`
          }
        </div>
      </div>
    </div>
    ${S.draft.paused ? `<div style="background:rgba(0,0,0,.15);color:white;text-align:center;padding:6px;font-size:.85em;font-weight:bold;letter-spacing:.05em">⏸ CLOCK PAUSED</div>` : ''}
    <div class="card-body" style="padding:${bs?'18px':'12px'}">
      <div style="${S.draft.paused ? 'opacity:.5;pointer-events:none;' : ''}">
      ${Object.entries(DRAFT_CATS).map(([key, c]) => {
        const catAvail = [...PLAYERS]
          .filter(n => PLAYER_META[n].cat === key)
          .sort((a,b) => (rating(b).skill||0) - (rating(a).skill||0));
        const remaining = catAvail.filter(n => !draftedNames.has(n)).length;
        const allGone = remaining === 0;
        const cards = catAvail.map(name => {
          const drafted = draftedNames.has(name);
          if (drafted) return '';
          const m = PLAYER_META[name];
          const r = rating(name);
          const gc = gradeColor[r.grade] || '#888';
          const rank25 = m.prev ? `#${m.prev.rank} '25` : (m.note ? 'N/A' : '&#127381;');
          return `<div class="dp-card" style="padding:${bsz.cardPad}">
            <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:5px">
              ${m.avatar ? `<img class="dp-avatar" src="${esc(m.avatar)}" alt="${esc(name)}" onclick="showProfile('${jsq(name)}')" style="cursor:pointer;width:${bsz.avatar};height:${bsz.avatar}" />` : ''}

            </div>
            ${bs ? '' : `<div class="dp-stats">
              <span title="Skill">&#9889; ${r.skill ?? '—'}</span>
              <span title="Vibes">&#10024; ${r.vibes ?? '—'}</span>
              <span style="background:${gc};color:white;border-radius:4px;padding:1px 5px">${r.grade ?? '—'}</span>
              <span style="color:var(--green)">${odds[name]}</span>
            </div>`}
            <button class="dp-pick-btn" style="background:${esc(tColor)};color:${headText};border:${onLight ? '2px solid #161616' : 'none'};width:100%;font-size:${bsz.btnFont};padding:${bsz.btnPad}" onclick="makePick('${jsq(name)}')">DRAFT</button>
          </div>`;
        }).filter(Boolean).join('');
        return `<div style="margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--border)">
            <span style="font-size:${bsz.catLabel};font-weight:bold">${c.label}</span>
            <span style="font-size:${bsz.catSub};color:#888;font-style:italic">${c.sub}</span>
            <span style="margin-left:auto;font-size:${bsz.catSub};font-weight:bold;color:${allGone?'var(--green)':'#555'}">${allGone ? '✓ All drafted' : `${remaining} left`}</span>
          </div>
          ${allGone ? `<div style="color:#aaa;font-size:.82em;font-style:italic;padding:6px 0">All players drafted ✓</div>` : `<div class="dp-grid" style="grid-template-columns:repeat(auto-fill,minmax(${bsz.gridMin},1fr));gap:${bsz.gridGap}">${cards}</div>`}
        </div>`;
      }).join('')}
      </div>
      ${bs ? '' : `<details style="margin-top:12px">
        <summary style="font-size:.82em;color:var(--green);cursor:pointer;list-style:none;display:inline-block;padding:2px 10px;border:1px solid var(--green);border-radius:10px">Draft Board (${pickIdx} picks)</summary>
        ${buildDraftBoard(draft)}
      </details>
      <div style="margin-top:10px;text-align:right">
        <button class="btn" style="background:#7a1a1a;color:white;font-size:.78em" onclick="resetDraft()">&#8635; Reset Draft</button>
      </div>`}
    </div>
  </div>`;
}

    const oc = btn.getAttribute('onclick');

    if (oc === "tab('day2')") btn.innerHTML = '&#9971; Day 2' + (S.locks?.day2 ? ' &#128274;' : '');
