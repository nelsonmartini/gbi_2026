function lockDay(day) {
  const label = day === 'day1' ? 'Day 1' : 'Day 2';
  const pin = prompt(`Enter commissioner PIN to lock ${label}:`);
  if (pin === null) return;
  if (pin.trim().toUpperCase() !== ADMIN_PIN.toUpperCase()) { alert('Incorrect PIN.'); return; }
  if (!S.locks) S.locks = {};
  S.locks[day] = true;
  save();
  renderDay(day);
  updateTabLockBadges();
}

function unlockDay(day) {
  const label = day === 'day1' ? 'Day 1' : 'Day 2';
  const pin = prompt(`Enter commissioner PIN to unlock ${label}:`);
  if (pin === null) return;
  if (pin.trim().toUpperCase() !== ADMIN_PIN.toUpperCase()) { alert('Incorrect PIN.'); return; }
  if (!S.locks) S.locks = {};
  S.locks[day] = false;
  save();
  renderDay(day);
  updateTabLockBadges();
}

// Hard guarantee against duplicate player picks — enforced at the data layer, not
// just by hiding <option>s in the dropdown. Rejects the write outright (with a clear
// alert) if that name is already used elsewhere in this day's 4-Man groups, no matter
// what the UI was showing at the moment of selection (stale render, race, anything).
function setGroupPlayer(day, gi, pi, value) {
  if (value) {
    const dupe = S[day].groups.some((g, gIdx) =>
      g.players.some((p, pIdx) => p === value && !(gIdx === gi && pIdx === pi))
    );
    if (dupe) {
      alert(`${value} is already in another 4-Man group today. Pick a different player.`);
      renderDay(day);
      return;
    }
  }
  S[day].groups[gi].players[pi] = value;
  save();
  renderDay(day);
}

// Same hard guarantee for the 2v2 matches — rejects if that name is already used in
// any other match slot today (including the other slot of the same match).
function setMatchPlayer(day, mi, field, value) {
  if (value) {
    const dupe = S[day].matches.some((m, mIdx) =>
      ['p1a', 'p1b', 'p2a', 'p2b'].some(f => m[f] === value && !(mIdx === mi && f === field))
    );
    if (dupe) {
      alert(`${value} is already in another 2v2 match today. Pick a different player.`);
      renderDay(day);
      return;
    }
  }
  S[day].matches[mi][field] = value;
  save();
  renderDay(day);
}

function renderDay(day) {
  const el = document.getElementById('pane-'+day);
  const label = day==='day1' ? 'Day 1' : 'Day 2';
  const locked = !!(S.locks && S.locks[day]);
  const sc = SC[day];
  const fmPts  = fourManPoints(day);
  const fmRanks = rank(S[day].groups.map(g => g.score));
  const mrs = matchResults(day);
  const tt = teamTotals();
  const td = day==='day1' ? {t1:tt.t1.d1,t2:tt.t2.d1} : {t1:tt.t1.d2,t2:tt.t2.d2};

  // Team day total header
  const dayMargin = Math.abs(td.t1 - td.t2);
  const dayLeadName = td.t1 > td.t2 ? S.teams.t1.name : td.t2 > td.t1 ? S.teams.t2.name : null;
  const dayMid = dayLeadName ? `${esc(dayLeadName)} +${fmt(dayMargin)}` : (td.t1+td.t2>0?'Tied':'&mdash;');
  let html = `
  <div class="team-compact-banner" style="margin-bottom:10px">
    <div class="tcb-side" style="background:${esc(S.teams.t1.color)};color:${contrastColor(S.teams.t1.color)}">
      <div class="tcb-name">${esc(S.teams.t1.name)}</div>
      <div class="tcb-score">${fmt(td.t1)}</div>
    </div>
    <div class="tcb-mid">
      <div class="tcb-vs">${label}</div>
      <div class="tcb-margin">${dayMid}</div>
    </div>
    <div class="tcb-side" style="background:${esc(S.teams.t2.color)};color:${contrastColor(S.teams.t2.color)}">
      <div class="tcb-name">${esc(S.teams.t2.name)}</div>
      <div class="tcb-score">${fmt(td.t2)}</div>
    </div>
  </div>
  <details style="margin-bottom:10px">
    <summary style="font-size:.8em;color:var(--gray);cursor:pointer;padding:4px 8px;list-style:none;display:flex;align-items:center;gap:6px">
      <span style="border:1px solid var(--border);border-radius:10px;padding:2px 10px;font-size:.95em">&#9432; Scoring guide</span>
    </summary>
    <div class="alert alert-gold" style="margin-top:6px;font-size:.83em">
      Enter group scores for the 4-Man Scramble, then pair scores for the 2v2. Points calculate automatically.
      1st=${sc.fourMan[0]}, 2nd=${sc.fourMan[1]}, 3rd=${sc.fourMan[2]}, 4th=${sc.fourMan[3]}, 5th=${sc.fourMan[4]} pts &nbsp;&middot;&nbsp; Match win +${sc.matchWin}, tie +${sc.matchTie}
    </div>
  </details>`;
  html += `
  <div class="sec-head" style="cursor:pointer;justify-content:space-between;user-select:none" onclick="toggleCollapse('${day}_four','${day}')">
    <h3>&#9971; 4-Man Scramble &mdash; ${label}</h3>
    <span style="font-size:.8em;color:var(--green);border:1px solid var(--green);padding:2px 10px;border-radius:12px">${_collapsed[day+'_four']===false?'&#9650; Hide':'&#9660; Show'}</span>
  </div>`;
  if (_collapsed[day+'_four'] === false) {
  html += `<div class="alert alert-info">Five groups of 4 players. Enter each group&rsquo;s score vs par (e.g. <strong>-5</strong>). Points: 1st=${sc.fourMan[0]}, 2nd=${sc.fourMan[1]}, 3rd=${sc.fourMan[2]}, 4th=${sc.fourMan[3]}, 5th=${sc.fourMan[4]}. Ties average the tied positions.</div>`;

  // 4-Man groups — build set of all already-chosen players for this day
  const usedInDay = new Set(S[day].groups.flatMap(g => g.players.filter(p => p !== '')));

  S[day].groups.forEach((g,gi) => {
    const pts = fmPts[gi];

    // Build one player slot: filters out players already used in other slots
    const makeGSlot = pi => {
      const cur = g.players[pi];
      const opts = PLAYERS.map(n => {
        if (usedInDay.has(n) && n !== cur) return '';
        return `<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`;
      }).join('');
      const tk = cur ? teamOf(cur) : null;
      const tm = tk ? S.teams[tk] : null;
      const badge = tm
        ? `<span class="tb" style="background:${esc(tm.color)};color:${contrastColor(tm.color)};display:inline-block;margin-top:4px">${esc(tm.name)}</span>`
        : `<span style="display:inline-block;height:22px;margin-top:4px"></span>`;
      const pm = cur ? PLAYER_META[cur] : null;
      const gAvatarStyle = 'width:34px;height:34px;border-radius:50%;flex-shrink:0;border:2px solid var(--border);cursor:pointer';
      const gAvatar = cur
        ? (pm && pm.avatar
          ? `<img src="${esc(pm.avatar)}" alt="${esc(cur)}" onclick="showProfile('${jsq(cur)}')" style="${gAvatarStyle};object-fit:cover" />`
          : (() => { const t2=teamOf(cur); const c2=t2?S.teams[t2].color:'#999'; return `<div onclick="showProfile('${jsq(cur)}')" style="${gAvatarStyle};background:${c2};color:${contrastColor(c2)};display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:bold">${initials(cur)}</div>`; })())
        : `<div style="width:34px;height:34px;flex-shrink:0"></div>`;
      return `<div class="form-group">
          <label>Player ${pi+1}</label>
          <div style="display:flex;align-items:center;gap:6px">${gAvatar}<div style="flex:1;min-width:0"><select ${locked ? 'disabled' : `onchange="setGroupPlayer('${day}',${gi},${pi},this.value)"`}>
            <option value="">— Select —</option>${opts}
          </select></div></div>
          ${badge}
        </div>`;
    };

    html += `
  <div class="gpanel">
    <div class="gpanel-head">
      <span>Group ${g.id}</span>
      <span class="gpanel-head-mid">${pts!==null ? `${ordinal(fmRanks[gi])} Place &nbsp;&middot;&nbsp; Score ${g.score} &nbsp;&middot;&nbsp; <strong>${fmt(pts)} pts</strong>/player` : ''}</span>
      <span class="gpanel-head-right">
        <input type="text" value="${esc(g.teeTime)}" placeholder="Tee time" style="width:66px;font-size:.85em"
          ${locked ? 'disabled' : `onchange="S.${day}.groups[${gi}].teeTime=this.value;save()"`} />
      </span>
    </div>
    <div class="gpanel-body">
      <div class="group-layout">
        <div class="group-col">${makeGSlot(0)}${makeGSlot(1)}</div>
        <div class="group-col">${makeGSlot(2)}${makeGSlot(3)}</div>
        <div class="group-score-box">
          <label>Score<br>vs par</label>
          <input type="number" value="${esc(g.score)}" placeholder="—"
            ${locked ? 'disabled' : `onchange="S.${day}.groups[${gi}].score=this.value;save();renderDay('${day}')"`} />
          ${pts!==null?`<div style="font-size:.75em;color:var(--green);font-weight:bold">${fmt(pts)} pts</div>`:''}
        </div>
      </div>
    </div>
  </div>`;
  });

  } // end 4-man collapse

  html += `
  <div class="sec-head" style="cursor:pointer;justify-content:space-between;user-select:none" onclick="toggleCollapse('${day}_match','${day}')">
    <h3>&#127948; 2v2 Head-to-Head &mdash; ${label}</h3>
    <span style="font-size:.8em;color:var(--green);border:1px solid var(--green);padding:2px 10px;border-radius:12px">${_collapsed[day+'_match']===false?'&#9650; Hide':'&#9660; Show'}</span>
  </div>`;
  if (_collapsed[day+'_match'] === false) {
  html += `<div class="alert alert-info">Five matches: one pair from each team. Win = +${sc.matchWin} pts, Tie = +${sc.matchTie} pts per player. Plus rank points among all 10 pairs (lower score ranks higher).</div>`;

  // 2v2 matches — teams locked from roster, no duplicate picks across all 5 matches
  const usedInMatches = new Set(
    S[day].matches.flatMap(m => [m.p1a, m.p1b, m.p2a, m.p2b].filter(p => p !== ''))
  );
  const matchT1Pool = S.roster.filter(p => p.team === 't1').map(p => p.name);
  const matchT2Pool = S.roster.filter(p => p.team === 't2').map(p => p.name);

  if (matchT1Pool.length === 0 || matchT2Pool.length === 0) {
    html += `<div class="alert alert-red">⚠️ Teams are not fully assigned. Go to <strong>Draft and Rosters</strong> and assign all players before setting up matches.</div>`;
  }

  const matchAvatar = name => {
    if (!name) return '<div style="width:34px;height:34px;flex-shrink:0"></div>';
    const pm = PLAYER_META[name];
    const baseStyle = 'width:34px;height:34px;border-radius:50%;flex-shrink:0;border:2px solid var(--border);cursor:pointer';
    if (pm && pm.avatar) return `<img src="${esc(pm.avatar)}" alt="${esc(name)}" onclick="showProfile('${jsq(name)}')" style="${baseStyle};object-fit:cover" />`;
    const t = teamOf(name); const tc = t ? S.teams[t].color : '#999';
    return `<div onclick="showProfile('${jsq(name)}')" style="${baseStyle};background:${tc};color:${contrastColor(tc)};display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:bold">${initials(name)}</div>`;
  };

  S[day].matches.forEach((m,mi) => {
    const r = mrs[mi];
    const s1 = m.score1 !== '' && m.score1 !== null ? parseFloat(m.score1) : null;
    const s2 = m.score2 !== '' && m.score2 !== null ? parseFloat(m.score2) : null;
    let winLabel = '';
    if (s1!==null && s2!==null && !isNaN(s1) && !isNaN(s2)) {
      if (s1 < s2) {
        const c = S.teams.t1.color;
        winLabel = `<span style="background:${esc(c)};color:${contrastColor(c)};border-radius:10px;padding:2px 10px;font-size:.82em;font-weight:bold">&#10003; ${esc(S.teams.t1.name)} wins</span>`;
      } else if (s2 < s1) {
        const c = S.teams.t2.color;
        winLabel = `<span style="background:${esc(c)};color:${contrastColor(c)};border-radius:10px;padding:2px 10px;font-size:.82em;font-weight:bold">&#10003; ${esc(S.teams.t2.name)} wins</span>`;
      } else {
        winLabel = `<span style="background:var(--gold);color:var(--green-dark);border-radius:10px;padding:2px 10px;font-size:.82em;font-weight:bold">&#61; Tied</span>`;
      }
    }

    // Builds a team-filtered, dedup-safe select for one player slot
    const makeMSlot = (field, cur, pool) => {
      const opts = pool.map(n => {
        if (usedInMatches.has(n) && n !== cur) return '';
        return `<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`;
      }).join('');
      return `<select ${locked ? 'disabled' : `onchange="setMatchPlayer('${day}',${mi},'${field}',this.value)"`}>
              <option value="">— Select —</option>${opts}
            </select>`;
    };

    const win1 = s1!==null && s2!==null && s1 < s2;
    const win2 = s1!==null && s2!==null && s2 < s1;
    const tied = s1!==null && s2!==null && s1 === s2;
    const dividerIcon = win1 ? '&#9668;' : win2 ? '&#9658;' : tied ? '&#61;' : 'VS';
    const dividerSub  = win1 ? esc(S.teams.t1.name) : win2 ? esc(S.teams.t2.name) : tied ? 'Tied' : '';

    html += `
  <div class="gpanel">
    <div class="gpanel-head">
      <span>Match ${m.id}</span>
      <span class="gpanel-head-mid">${winLabel}</span>
      <span class="gpanel-head-right">
        <input type="text" value="${esc(m.teeTime)}" placeholder="Tee time" style="width:66px;font-size:.85em"
          ${locked ? 'disabled' : `onchange="S.${day}.matches[${mi}].teeTime=this.value;save()"`} />
      </span>
    </div>
    <div class="match-arena">
      <div class="match-side${win1?' match-winner':''}">
        <div class="ms-header" style="background:${esc(S.teams.t1.color)};color:${contrastColor(S.teams.t1.color)}">${win1?'&#127942; ':''}${esc(S.teams.t1.name)}</div>
        <div class="form-group">
          <label>Player 1</label>
          <div style="display:flex;align-items:center;gap:6px">${matchAvatar(m.p1a)}<div style="flex:1;min-width:0">${makeMSlot('p1a', m.p1a, matchT1Pool)}</div></div>
        </div>
        <div class="form-group">
          <label>Player 2</label>
          <div style="display:flex;align-items:center;gap:6px">${matchAvatar(m.p1b)}<div style="flex:1;min-width:0">${makeMSlot('p1b', m.p1b, matchT1Pool)}</div></div>
        </div>
        <div class="form-group">
          <label>Score (vs par)</label>
          <input type="number" class="score-in" value="${esc(m.score1)}" placeholder="&mdash;"
            ${locked ? 'disabled' : `onchange="S.${day}.matches[${mi}].score1=this.value;save();renderDay('${day}')"`} />
        </div>
        ${r.p1.total ? `<div class="ms-pts"><strong>${fmt(r.p1.total)} pts</strong> &nbsp;<span style="color:#888;font-size:.9em">${ordinal(r.p1.rank)} overall &middot; +${fmt(r.p1.win)} win +${fmt(r.p1.rankPts)} rank</span></div>` : ''}
      </div>
      <div class="match-divider">
        <div style="font-size:1.3em">${dividerIcon}</div>
        <div style="font-size:.68em;color:#888;text-align:center;letter-spacing:.3px">${dividerSub}</div>
      </div>
      <div class="match-side${win2?' match-winner':''}">
        <div class="ms-header" style="background:${esc(S.teams.t2.color)};color:${contrastColor(S.teams.t2.color)}">${win2?'&#127942; ':''}${esc(S.teams.t2.name)}</div>
        <div class="form-group">
          <label>Player 1</label>
          <div style="display:flex;align-items:center;gap:6px">${matchAvatar(m.p2a)}<div style="flex:1;min-width:0">${makeMSlot('p2a', m.p2a, matchT2Pool)}</div></div>
        </div>
        <div class="form-group">
          <label>Player 2</label>
          <div style="display:flex;align-items:center;gap:6px">${matchAvatar(m.p2b)}<div style="flex:1;min-width:0">${makeMSlot('p2b', m.p2b, matchT2Pool)}</div></div>
        </div>
        <div class="form-group">
          <label>Score (vs par)</label>
          <input type="number" class="score-in" value="${esc(m.score2)}" placeholder="&mdash;"
            ${locked ? 'disabled' : `onchange="S.${day}.matches[${mi}].score2=this.value;save();renderDay('${day}')"`} />
        </div>
        ${r.p2.total ? `<div class="ms-pts"><strong>${fmt(r.p2.total)} pts</strong> &nbsp;<span style="color:#888;font-size:.9em">${ordinal(r.p2.rank)} overall &middot; +${fmt(r.p2.win)} win +${fmt(r.p2.rankPts)} rank</span></div>` : ''}
      </div>
    </div>
  </div>`;
  });
  } // end 2v2 collapse

  // Day results table
  html += `
  <div class="sec-head"><h3>📋 ${label} Player Results</h3></div>
  <div class="card"><div class="card-body">${renderDayTable(day)}</div></div>`;

  // Lock bar at the bottom
  html += locked
    ? `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff3cd;border:1px solid #e6c84a;border-radius:7px;padding:10px 14px;margin-top:10px">
        <span style="font-weight:bold;color:#7a5a00">&#128274; ${label} is locked — scores are final</span>
        <button class="btn btn-sm" style="background:#7a1a1a;color:white;font-size:.8em" onclick="unlockDay('${day}')">Unlock</button>
       </div>`
    : `<div style="display:flex;align-items:center;justify-content:flex-end;margin-top:10px">
        <button class="btn btn-sm" style="background:var(--green);color:white;font-size:.85em" onclick="lockDay('${day}')">&#128274; Lock ${label}</button>
       </div>`;

  el.innerHTML = html;
}

function renderDayTable(day) {
  const dk = day==='day1'?'d1':'d2';
  const rows = allPlayerStats().map(p=>({...p, dp:p[dk]})).sort((a,b)=>b.dp.total-a.dp.total||a.name.localeCompare(b.name));
  if (rows.every(r=>r.dp.total===0)) return `<div class="empty">No scores entered yet for this day.</div>`;
  const pp = ppPlayers();
  let html = `<table><thead><tr>
    <th>Rank</th><th>Player</th><th class="hide-phone">Team</th>
    <th class="c">4-Man</th><th class="c">2-Man</th><th class="c">Holes</th><th class="c">Total</th>
  </tr></thead><tbody>`;
  let rk=1,prev=null;
  rows.forEach((p,i)=>{
    if (p.dp.total!==prev) rk=i+1;
    const twoMan = p.dp.matchWin + p.dp.matchRank;
    html+=`<tr${rk<=3?' class="winner"':''}>
      <td><span class="rank${rk<=3?' gold':''}">${rk}</span></td>
      <td><strong><span class="plink" onclick="showProfile('${jsq(p.name)}')">${flag(p.name)} ${esc(p.name)}</span>${ppBadge(p.name,pp)}</strong></td><td class="hide-phone">${tBadge(p.team)}</td>
      <td class="c">${fmt(p.dp.fourMan)}</td>
      <td class="c">${fmt(twoMan)}</td>
      <td class="c">${fmt(p.dp.payout)}</td>
      <td class="c">${ppPts(p.name,pp,p.dp.total)}</td>
    </tr>`;
    prev=p.dp.total;
  });
  return `<div class="table-scroll">${html}</tbody></table></div>`;
}

/* ═══════════════════════════════════════════════════════
   HOLE PAYOUTS
═══════════════════════════════════════════════════════ */
function renderPayouts() {
  const el = document.getElementById('pane-payouts');

  // Calc totals per player
  const totals = {};
  PLAYERS.forEach(n => { totals[n] = { wins:0, pts:0, money:0 }; });
  ['day1','day2'].forEach(day => {
    S[day].payouts.forEach(p => {
      if (p.cat!=='NP' && p.winner && totals[p.winner]) {
        totals[p.winner].wins++;
        totals[p.winner].pts += SC.payoutPts;
        totals[p.winner].money += SC.payoutMoney;
      }
    });
  });

  const d1won = S.day1.payouts.filter(p=>p.cat!=='NP'&&p.winner).length;
  const d2won = S.day2.payouts.filter(p=>p.cat!=='NP'&&p.winner).length;

  function holeTable(day, label) {
    const dayLocked = !!(S.locks && S.locks[day]);
    const won = day==='day1'?d1won:d2won;
    const key = 'payouts_' + day;
    const expanded = _collapsed[key] === false;
    let t = `<div class="card">
      <div class="card-header" style="cursor:pointer" onclick="_collapsed['${key}']=_collapsed['${key}']===false?true:false;renderPayouts()">
        <span>${label} <span class="badge-gold" style="font-size:.82em">${won}/20 assigned &nbsp;|&nbsp; $${won*20} of $400</span></span>
        <span style="font-size:.78em;white-space:nowrap">${expanded ? '&#9650; Hide' : '&#9660; Show'}</span>
      </div>`;
    if (expanded) {
    t += `<div class="card-body">
      <table><thead><tr><th>Hole</th><th>Category</th><th>Winner</th><th class="c">Pts</th><th class="c">$</th></tr></thead><tbody>`;
    S[day].payouts.forEach((p,i) => {
      if (p.cat==='NP') {
        t += `<tr style="opacity:.55"><td>${p.hole}</td><td><span class="cat cat-NP">No Prize</span></td><td colspan="3" style="font-style:italic;color:#aaa">No payout this hole</td></tr>`;
      } else {
        const catLabel = p.cat==='LD'?'Long Drive':p.cat==='C2P'?'Closest to Pin':'Longest Putt';
        t += `<tr>
          <td><strong>Hole ${p.hole}</strong></td>
          <td><span class="cat cat-${p.cat}">${catLabel}</span></td>
          <td>
            <select ${dayLocked ? 'disabled' : `onchange="S.${day}.payouts[${i}].winner=this.value;save();renderPayouts()"`}>
              <option value="">— No winner —</option>${playerOpts(p.winner)}
            </select>
          </td>
          <td class="c">${p.winner?'<span class="pts">2</span>':'—'}</td>
          <td class="c">${p.winner?'<span class="money">$20</span>':'—'}</td>
        </tr>`;
      }
    });
    t += `</tbody></table>`;
    t += dayLocked
      ? `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff3cd;border-top:1px solid #e6c84a;padding:10px 14px;margin-top:8px;border-radius:0 0 6px 6px">
          <span style="font-weight:bold;color:#7a5a00;font-size:.9em">&#128274; ${label} is locked</span>
          <button class="btn btn-sm" style="background:#7a1a1a;color:white;font-size:.8em" onclick="unlockDay('${day}');renderPayouts()">Unlock</button>
         </div>`
      : `<div style="display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);margin-top:8px">
          <button class="btn btn-sm" style="background:var(--green);color:white;font-size:.8em" onclick="lockDay('${day}');renderPayouts()">&#128274; Lock ${label}</button>
         </div>`;
    t += `</div>`;
    }
    t += `</div>`;
    return t;
  }

  const leaderRows = Object.entries(totals).filter(([n,s])=>s.wins>0).sort((a,b)=>b[1].money-a[1].money);

  let html = `
  <div class="alert alert-gold"><strong>Hole Payouts</strong> — $20 per hole, 40 total payout holes (20 per day). Total hole payout pot: <strong>$800</strong>. Categories: Long Drive (LD), Closest to Pin (C2P), Longest Putt (LP).</div>

  <div class="two-col">
    ${holeTable('day1','📅 Day 1 Hole Payouts')}
    ${holeTable('day2','📅 Day 2 Hole Payouts')}
  </div>

  <div class="card">
    <div class="card-header">💰 Hole Payout Leaderboard</div>
    <div class="card-body">`;

  if (!leaderRows.length) {
    html += `<div class="empty"><div class="eicon">💰</div>No hole winners assigned yet.</div>`;
  } else {
    html += `<div class="table-scroll"><table><thead><tr><th>Rank</th><th>Player</th><th>Team</th><th class="c">Holes Won</th><th class="c">Payout Pts</th><th class="c">Payout $</th></tr></thead><tbody>`;
    leaderRows.forEach(([name,s],i) => {
      html += `<tr${i<3?' class="winner"':''}>
        <td><span class="rank${i<3?' gold':''}">${i+1}</span></td>
        <td><strong><span class="plink" onclick="showProfile('${jsq(name)}')">${flag(name)} ${esc(name)}</span></strong></td>
        <td>${tBadge(teamOf(name))}</td>
        <td class="c">${s.wins}</td>
        <td class="c pts">${s.pts}</td>
        <td class="c money">$${s.money}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div></div>`;
  el.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════
   MONIES
═══════════════════════════════════════════════════════ */
function renderMonies() {
  const el = document.getElementById('pane-monies');
  const all = allPlayerStats();
  const anyScores = all.some(p => p.total > 0);
  const tt = teamTotals();
  const mdl = rk => rk===1?'&#128081;':rk===2?'&#129352;':rk===3?'&#129353;':`<span class="rank">${rk}</span>`;

  // Ranked standings (same logic as scoreboard)
  let rkc = 1, prevTot = null;
  const ranked = [];
  all.forEach((p, i) => {
    if (p.total !== prevTot) rkc = i + 1;
    ranked.push({ ...p, rk: rkc });
    prevTot = p.total;
  });

  // Hole payouts — computed first so rollover is available everywhere below
  const holeDays = { day1: { claimed: 0, unclaimed: 0 }, day2: { claimed: 0, unclaimed: 0 } };
  ['day1','day2'].forEach(day => {
    S[day].payouts.forEach(p => {
      if (p.cat === 'NP') return;
      if (p.winner) holeDays[day].claimed += 20; else holeDays[day].unclaimed += 20;
    });
  });
  const claimedHole = holeDays.day1.claimed + holeDays.day2.claimed;
  const unclaimedHole = holeDays.day1.unclaimed + holeDays.day2.unclaimed;
  const totalHolePot = claimedHole + unclaimedHole || 800;

  const d1rollover = (S.locks?.day1) ? holeDays.day1.unclaimed : 0;
  const d2rollover = (S.locks?.day2) ? holeDays.day2.unclaimed : 0;
  const totalRollover = d1rollover + d2rollover;

  // Unclaimed hole money rolls to individual prizes: 60% / 30% / 10%
  const roll1 = Math.round(totalRollover * 0.6);
  const roll2 = Math.round(totalRollover * 0.3);
  const roll3 = totalRollover - roll1 - roll2;
  const PRIZE_AMOUNTS = [400 + roll1, 200 + roll2, 100 + roll3];

  function finishPrize(name) {
    if (!anyScores) return 0;
    for (let pos = 1; pos <= 3; pos++) {
      const tied = ranked.filter(p => p.rk === pos);
      if (!tied.find(p => p.name === name)) continue;
      if (tied.length === 1) return PRIZE_AMOUNTS[pos - 1];
      let pool = 0;
      for (let i = 0; i < tied.length && (pos + i - 1) < 3; i++) pool += PRIZE_AMOUNTS[pos + i - 1];
      return Math.round(pool / tied.length);
    }
    return 0;
  }

  // Team champ — flat $500, rollover no longer goes here
  const leadTeamKey = tt.t1.total > tt.t2.total ? 't1' : tt.t2.total > tt.t1.total ? 't2' : null;
  const leadTeamName = leadTeamKey ? tt[leadTeamKey].name : null;

  function teamPrize(name) {
    if (!anyScores || !leadTeamKey) return 0;
    const p = S.roster.find(r => r.name === name);
    return (p && p.team === leadTeamKey) ? 50 : 0;
  }

  // Pot totals for tracker bars
  const finishClaimed = anyScores ? PRIZE_AMOUNTS.reduce((sum, amt, i) => {
    const pos = i + 1;
    const tied = ranked.filter(p => p.rk === pos);
    return tied.length ? sum + amt : sum;
  }, 0) : 0;
  const teamBaseClaimed = (anyScores && leadTeamKey) ? 500 : 0;
  const teamClaimed = teamBaseClaimed;
  const totalDistributed = claimedHole + finishClaimed + teamClaimed;
  const GRAND_TOTAL = 2000;

  function pctBar(claimed, total, color) {
    const pct = total > 0 ? Math.round((claimed / total) * 100) : 0;
    return `<div style="background:#e0e0e0;border-radius:5px;overflow:hidden;height:12px;margin:5px 0 3px">
      <div style="background:${color};height:100%;width:${pct}%;transition:width .4s"></div>
    </div><div style="font-size:.78em;color:#666">${pct}% &nbsp;&middot;&nbsp; <strong class="money">$${claimed}</strong> of $${total}</div>`;
  }

  // Names at each finish position (handles ties correctly with filter)
  function posNames(pos) {
    const tied = ranked.filter(p => p.rk === pos);
    if (!anyScores || !tied.length) return `<span style="color:#aaa;font-style:italic">TBD</span>`;
    const names = tied.map(p => `<strong>${flag(p.name)} ${esc(p.name)}</strong>`).join(' &amp; ');
    return tied.length > 1 ? `${names} <em style="color:#b07000;font-size:.85em">(tied — split)</em>` : names;
  }

  let html = '';

  // ── Grand Total Banner ──
  const potRows = [
    { label: '📅 Day 1 Hole Payouts', pot: 400,                   claimed: holeDays.day1.claimed + d1rollover, color: 'var(--green)' },
    { label: '📅 Day 2 Hole Payouts', pot: 400,                   claimed: holeDays.day2.claimed + d2rollover, color: 'var(--green)' },
    { label: '🎖️ Individual Prizes',  pot: 700 + totalRollover,   claimed: finishClaimed,                      color: '#c8a800'      },
    { label: '🏆 Team Championship',  pot: 500,                   claimed: teamClaimed,                        color: '#1a4a8a'      },
  ];
  const poolExpanded = _collapsed['monies_pool'] === false;
  html += `<div class="card" style="margin-bottom:10px">
    <div class="card-header" style="cursor:pointer" onclick="_collapsed['monies_pool']=_collapsed['monies_pool']===false?true:false;renderMonies()">
      <span>💰 Total Prize Pool — $${GRAND_TOTAL}</span>
      <span style="font-size:.78em;font-weight:normal">${poolExpanded ? '&#9650; Hide' : '&#9660; Show'}</span>
    </div>`;
  if (poolExpanded) {
  html += `<div class="card-body" style="padding:12px 16px">
      ${pctBar(totalDistributed, GRAND_TOTAL, 'var(--green)')}
      <div style="font-size:.82em;color:#888;margin-top:2px">$${totalDistributed} distributed &nbsp;&middot;&nbsp; $${GRAND_TOTAL - totalDistributed} still in play</div>
      <details style="margin-top:6px">
        <summary style="font-size:.8em;color:var(--green);cursor:pointer;list-style:none;display:inline-block;padding:2px 8px;border:1px solid var(--green);border-radius:10px">Breakdown</summary>
        <table style="width:100%;border-collapse:collapse;margin-top:8px">
          ${potRows.map(r => {
            const slicePct = Math.round((r.pot / GRAND_TOTAL) * 100);
            const claimPct = r.pot > 0 ? Math.min(100, Math.round((r.claimed / r.pot) * 100)) : 0;
            return `<tr style="border-top:1px solid var(--border)">
              <td style="padding:7px 6px 7px 0;font-size:.88em;white-space:nowrap">${r.label}</td>
              <td style="padding:7px 4px;text-align:right;white-space:nowrap;font-size:.88em"><strong class="money">$${r.pot}</strong></td>
              <td style="padding:7px 4px;text-align:right;white-space:nowrap;font-size:.82em;color:#888">${slicePct}% of pot</td>
              <td style="padding:7px 0 7px 8px;width:120px">
                <div style="background:#e0e0e0;border-radius:4px;overflow:hidden;height:8px">
                  <div style="background:${r.color};height:100%;width:${claimPct}%;transition:width .4s"></div>
                </div>
                <div style="font-size:.72em;color:#888;margin-top:2px">$${r.claimed} / $${r.pot} (${claimPct}%)</div>
              </td>
            </tr>`;
          }).join('')}
        </table>
      </details>
    </div>`;
  }
  html += `</div>`;

  // ── Pot Tracker ──
  const detailsSummary = `<summary style="font-size:.8em;color:var(--green);cursor:pointer;list-style:none;display:inline-block;margin-top:5px;padding:2px 8px;border:1px solid var(--green);border-radius:10px">Details</summary>`;

  // Team details breakdown
  let teamWho = `<span style="color:#aaa;font-style:italic">TBD — no scores yet</span>`;
  if (anyScores && leadTeamKey) {
    const tColor = S.teams[leadTeamKey].color;
    const teamPlayers = S.roster.filter(p => p.team === leadTeamKey).map(p => esc(p.name)).join(', ');
    teamWho = `<span class="tb" style="background:${esc(tColor)};color:${contrastColor(tColor)}">${esc(leadTeamName)}</span>
      <table style="margin-top:10px;font-size:.85em;border-collapse:collapse;width:100%;max-width:380px">
        <tr><td style="padding:3px 8px 3px 0;color:#666">🏆 Prize</td><td class="money" style="text-align:right">$500</td><td style="color:#aaa;font-size:.85em;padding-left:8px">$50/player</td></tr>
      </table>
      <div style="color:#666;font-size:.8em;margin-top:6px">→ ${teamPlayers}</div>`;
  }

  const potExpanded = _collapsed['monies_pottracker'] === false;
  html += `<div class="card" style="margin-bottom:10px">
    <div class="card-header" style="cursor:pointer" onclick="_collapsed['monies_pottracker']=_collapsed['monies_pottracker']===false?true:false;renderMonies()">
      <span>🏆 Pot Tracker</span>
      <span style="font-size:.78em;font-weight:normal">${potExpanded ? '&#9650; Hide' : '&#9660; Show'}</span>
    </div>`;
  if (potExpanded) {
  html += `<div class="card-body">

    <div style="margin-bottom:18px">
      <div style="font-weight:bold;margin-bottom:4px">🎖️ Individual Finish Prizes &mdash; $${700 + totalRollover}</div>
      ${pctBar(finishClaimed, 700 + totalRollover, '#c8a800')}
      <details style="margin-top:2px">${detailsSummary}
        <table style="width:100%;max-width:500px;margin-top:8px;font-size:.88em;border-collapse:collapse"><tbody>
          <tr><td style="width:28px">🥇</td><td style="width:70px"><strong class="money">$${PRIZE_AMOUNTS[0]}</strong>${roll1>0?`<span style="color:#1a7a1a;font-size:.8em"> (+$${roll1})</span>`:''}</td><td>${posNames(1)}</td></tr>
          <tr><td>🥈</td><td><strong class="money">$${PRIZE_AMOUNTS[1]}</strong>${roll2>0?`<span style="color:#1a7a1a;font-size:.8em"> (+$${roll2})</span>`:''}</td><td>${posNames(2)}</td></tr>
          <tr><td>🥉</td><td><strong class="money">$${PRIZE_AMOUNTS[2]}</strong>${roll3>0?`<span style="color:#1a7a1a;font-size:.8em"> (+$${roll3})</span>`:''}</td><td>${posNames(3)}</td></tr>
          ${totalRollover > 0 ? `<tr style="border-top:1px solid var(--border)"><td colspan="3" style="padding-top:6px;color:#1a7a1a;font-size:.82em">⛳ $${totalRollover} rolled from unclaimed hole payouts (60/30/10%)</td></tr>` : ''}
        </tbody></table>
      </details>
    </div>

    <div style="margin-bottom:18px">
      <div style="font-weight:bold;margin-bottom:4px">🏆 Team Championship &mdash; $500</div>
      ${pctBar(teamClaimed, 500, '#1a4a8a')}
      <details style="margin-top:2px">${detailsSummary}
        <div style="margin-top:6px">${teamWho}</div>
      </details>
    </div>

    ${['day1','day2'].map(day => {
      const hd = holeDays[day];
      const roll = day === 'day1' ? d1rollover : d2rollover;
      const dayLocked = !!(S.locks?.[day]);
      const dayLabel = day === 'day1' ? 'Day 1 Hole Payouts' : 'Day 2 Hole Payouts';
      const allocated = hd.claimed + roll;
      const claimedPct = Math.round((hd.claimed / 400) * 100);
      const rollPct = Math.round((roll / 400) * 100);
      const pendingPct = 100 - claimedPct - rollPct;
      const detailRows = `
        <table style="font-size:.85em;border-collapse:collapse;width:100%;max-width:380px;margin-top:6px">
          <tr><td style="padding:3px 8px 3px 0;color:#666">💵 Paid to players</td><td class="money" style="text-align:right">$${hd.claimed}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${claimedPct}% of pot</td></tr>
          ${roll > 0
            ? `<tr><td style="padding:3px 8px 3px 0;color:#1a7a1a">🏆 Rolled → team &#128274;</td><td class="money" style="text-align:right">$${roll}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${rollPct}% of pot</td></tr>`
            : hd.unclaimed > 0
              ? `<tr><td style="padding:3px 8px 3px 0;color:#b07000">⏳ Pending (unclaimed)</td><td style="text-align:right;color:#b07000">$${hd.unclaimed}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${pendingPct}% of pot</td></tr>`
              : ''}
          <tr style="border-top:1px solid var(--border)"><td style="padding:5px 8px 3px 0;color:#666">Total accounted</td><td style="text-align:right"><strong>$${allocated}</strong></td><td style="color:#aaa;font-size:.85em;padding-left:8px">${claimedPct + rollPct}%</td></tr>
        </table>`;
      return `<div${day === 'day1' ? ' style="margin-bottom:18px"' : ''}>
        <div style="font-weight:bold;margin-bottom:4px">⛳ ${dayLabel} &mdash; $400</div>
        ${pctBar(allocated, 400, 'var(--green)')}
        <details style="margin-top:2px">${detailsSummary}${detailRows}
        </details>
      </div>`;
    }).join('')}

    </div>`;
  }
  html += `</div>`;

  // ── Player Winnings Table — scoreboard order, money columns only ──
  const mc = v => v ? `<strong class="money">$${v}</strong>` : `<span style="color:#ddd">—</span>`;

  html += `<div class="card">
    <div class="card-header">💵 Player Winnings</div>
    <div class="card-body" style="padding:0">
      <div class="table-scroll">
      <table class="sb-table" style="width:100%"><thead><tr>
        <th class="c" style="width:36px"></th>
        <th>Player</th>
        <th class="c">Holes</th>
        <th class="c">Team</th>
        <th class="c">Finish</th>
        <th class="c">💰 Total</th>
      </tr></thead><tbody>`;

  let prevRk = null, dispRk = 1;
  ranked.forEach((p, i) => {
    if (p.total !== prevRk) dispRk = i + 1;
    prevRk = p.total;
    const fm = finishPrize(p.name);
    const tm = teamPrize(p.name);
    const holeMoney = p.d1.money + p.d2.money;
    const totalWon = holeMoney + fm + tm;
    html += `<tr${dispRk <= 3 ? ' class="winner"' : ''}>
      <td class="c" style="font-size:1.2em">${mdl(dispRk)}</td>
      <td style="font-size:1.2em"><strong><span class="plink" onclick="showProfile('${jsq(p.name)}')">${flag(p.name)} ${esc(p.name)}</span></strong></td>
      <td class="c">${mc(holeMoney)}</td>
      <td class="c">${mc(tm)}</td>
      <td class="c">${mc(fm)}</td>
      <td class="c">${totalWon ? `<strong class="money" style="font-size:1.05em">$${totalWon}</strong>` : `<span style="color:#ccc">$0</span>`}</td>
    </tr>`;
  });

  html += `</tbody></table></div></div></div>`;
  el.innerHTML = html;
}

// Animates the scatter dots sliding to their new spot instead of just snapping there,
// using the View Transitions API where supported (falls back to an instant re-render
// on older browsers — no loss of functionality, just no slide animation)
function rerenderAnalytics() {
  if (document.startViewTransition) document.startViewTransition(() => renderAnalytics());
  else renderAnalytics();
}
function unlockMatrix() {
  const pin = prompt('Enter Bode Matrix PIN to unlock editing:');
  if (!pin || pin.trim().toUpperCase() !== MATRIX_PIN.toUpperCase()) { alert('Incorrect PIN.'); return; }
  _matrixUnlocked = true;
  _collapsed['analytics_matrix'] = false;
  rerenderAnalytics();
}
function lockMatrix() {
  _matrixUnlocked = false;
  rerenderAnalytics();
}
function setRating(name, field, value) {
  const key = ratingKey(name);
  if (!S.ratings[key]) S.ratings[key] = { skill:null, vibes:null, grade:null };
  S.ratings[key][field] = field === 'grade' ? (value || null) : (value === '' ? null : parseFloat(value));
  save();
  rerenderAnalytics();
}
function initials(name) {
  const clean = name.replace('.', '').trim();
  const parts = clean.split(' ');
  return (parts.length > 1 ? parts[0][0] + parts[1][0] : clean.slice(0, 2)).toUpperCase();
}
function renderBodeMatrixScatter() {
  // Raw positions for every player with a rating
  const points = PLAYERS.map(name => {
    const r = rating(name);
    if (r.skill === null || r.vibes === null) return null;
    return { name, left: Math.min(100, Math.max(0, r.skill * 10)), top: Math.min(100, Math.max(0, (10 - r.vibes) * 10)) };
  }).filter(Boolean);

  // Push apart any dots close enough to bury each other, by gently relaxing the
  // whole layout over a few passes — keeps everyone near their true position while
  // guaranteeing every dot stays fully visible and clickable (no overlap, however dense)
  const MIN_DIST = 9;
  for (let iter = 0; iter < 60; iter++) {
    let moved = false;
    for (let i = 0; i < points.length; i++) {
      for (let j = i + 1; j < points.length; j++) {
        const a = points[i], b = points[j];
        const dx = b.left - a.left, dy = b.top - a.top;
        const dist = Math.hypot(dx, dy) || 0.01;
        if (dist < MIN_DIST) {
          const push = (MIN_DIST - dist) / 2;
          const ux = dx / dist, uy = dy / dist;
          a.left -= ux * push; a.top -= uy * push;
          b.left += ux * push; b.top += uy * push;
          moved = true;
        }
      }
    }
    points.forEach(p => { p.left = Math.min(96, Math.max(4, p.left)); p.top = Math.min(96, Math.max(4, p.top)); });
    if (!moved) break;
  }

  const dots = points.map(({ name, left, top }) => {
    const m = PLAYER_META[name];
    const tc = teamOf(name) ? S.teams[teamOf(name)].color : '#999';
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const inner = m.avatar
      ? `<img src="${esc(m.avatar)}" alt="${esc(name)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.3)" />`
      : `<div style="width:100%;height:100%;border-radius:50%;background:${tc};color:${contrastColor(tc)};display:flex;align-items:center;justify-content:center;font-size:.68em;font-weight:bold;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.3)">${initials(name)}</div>`;
    return `<div style="position:absolute;left:${left}%;top:${top}%;width:34px;height:34px;margin:-17px 0 0 -17px;cursor:pointer;z-index:1;view-transition-name:bode-dot-${slug}" title="${esc(name)}" onclick="showProfile('${jsq(name)}')">${inner}</div>`;
  }).join('');
  return `

function renderBodeMatrixTable() {
  const gradeColor = { A:'#16a34a', B:'#2563eb', C:'#d97706', D:'#ea580c', F:'#dc2626' };
  const bySkill = [...PLAYERS].sort((a,b) => (rating(b).skill ?? -1) - (rating(a).skill ?? -1));
  const bar = (val, col) => `<div style="display:flex;align-items:center;gap:6px">
      <div style="flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;min-width:60px">
        <div style="height:100%;width:${(val||0)*10}%;background:${col};border-radius:4px"></div>
      </div>
      <span style="font-size:.8em;font-weight:bold;color:${col};min-width:26px">${val ?? '—'}</span>
    </div>`;
  let rows = '';
  bySkill.forEach(n => {
    const r = rating(n);
    const gc = gradeColor[r.grade] || '#888';
    const gradeCell = _matrixUnlocked
      ? `<select onchange="setRating('${jsq(n)}','grade',this.value)" style="font-size:.85em">
          <option value="">—</option>
          ${['A','B','C','D','F'].map(g => `<option value="${g}" ${r.grade===g?'selected':''}>${g}</option>`).join('')}
        </select>`
      : (r.grade ? `<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:${gc};color:white;font-weight:bold;font-size:.9em">${r.grade}</span>` : `<span style="color:#aaa">&mdash;</span>`);
    const skillCell = _matrixUnlocked
      ? `<input type="number" min="0" max="10" step="0.1" value="${r.skill ?? ''}" style="width:64px" onchange="setRating('${jsq(n)}','skill',this.value)" />`
      : bar(r.skill, 'var(--green)');
    const vibesCell = _matrixUnlocked
      ? `<input type="number" min="0" max="10" step="0.1" value="${r.vibes ?? ''}" style="width:64px" onchange="setRating('${jsq(n)}','vibes',this.value)" />`
      : bar(r.vibes, 'var(--gold-dark)');
    rows += `<tr>
      <td><strong>${flag(n)} ${esc(n)}</strong>${ppChampBadge(n)}</td>
      <td class="c hide-mobile">${tBadge(teamOf(n))}</td>
      <td class="c">${gradeCell}</td>
      <td style="min-width:100px">${skillCell}</td>
      <td style="min-width:100px">${vibesCell}</td>
    </tr>`;
  });
  return `<table><thead><tr>
    <th>Player</th><th class="c hide-mobile">Team</th>
    <th class="c">Bode Grade</th><th>Skill</th><th>Vibes</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}
function renderBodeMatrix() {
  return `
      ${renderBodeMatrixScatter()}
      ${renderBodeMatrixTable()}`;
}

// Generic collapsible card for Analytics tab sections — collapsed by default on every page load
function analyticsCard(key, headerLabel, bodyFn, extraHeaderHtml) {
  const expanded = _collapsed[key] === false;
  return `<div class="card">
    <div class="card-header" style="cursor:pointer" onclick="_collapsed['${key}']=_collapsed['${key}']===false?true:false;renderAnalytics()">
      <span>${headerLabel}</span>
      <span style="display:flex;align-items:center;gap:8px">
        ${extraHeaderHtml || ''}
        <span style="font-size:.78em;font-weight:normal">${expanded ? '&#9650; Hide' : '&#9660; Show'}</span>
      </span>
    </div>
    ${expanded ? `<div class="card-body">${bodyFn()}</div>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   GLOBAL ERROR CATCHER — shows real JS errors on-screen instead of
   silently failing, so issues can be reported with exact detail
═══════════════════════════════════════════════════════ */
function showErrorBanner(text) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7a1a1a;color:white;padding:10px 14px;font-size:.78em;z-index:99999;font-family:monospace;max-height:40vh;overflow-y:auto;white-space:pre-wrap';
  el.textContent = text;
  document.body.appendChild(el);
}
window.addEventListener('error', e => {
  // The generic "Script error." with 0:0 is the browser's cross-origin redaction —
  // it carries zero diagnostic info and shows up harmlessly during things like the
  // iOS Share Sheet briefly inspecting the page (e.g. for Add to Home Screen).
  // Not worth alarming over since there's nothing actionable in it.
  if (e.message === 'Script error.' && e.lineno === 0 && e.colno === 0) return;
  showErrorBanner('⚠️ JS ERROR: ' + e.message + ' (' + (e.filename||'') + ':' + e.lineno + ':' + e.colno + ')');
});
window.addEventListener('unhandledrejection', e => {
  const msg = e.reason?.message || String(e.reason || '');
  // Known-benign Firebase/Safari IndexedDB quirk (auth session persistence getting
  // disrupted by backgrounding or clearing site data) — not an app bug, not actionable.
  if (msg.includes('in-progress transaction')) return;
  showErrorBanner('⚠️ PROMISE ERROR: ' + msg);
});

   BOOT
═══════════════════════════════════════════════════════ */
boot();
setInterval(() => { if (_dataLoaded && _cur === 'scoreboard' && TOURNEY_DATE - new Date() > 0) renderScoreboard(); }, 1000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      if (!newWorker) return;
      newWorker.addEventListener('statechange', () => {
        // installed + an existing controller means this is an UPDATE, not the first-ever install
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          const badge = document.getElementById('update-badge');
          if (badge) badge.style.display = 'inline-block';
        }
      });
    });
  }).catch(() => {});
}
</script>
<div id="profile-modal"></div>
</body>
