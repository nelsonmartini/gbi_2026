<html lang="en">
<head>

<title>Garland Bend Invitational 2026</title>

<link rel="icon" type="image/jpeg" href="gbi-logo.jpg">

<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://nelsonmartini.github.io/gbi_2026/gbi-logo.jpg">
<style>
:root {
  --green: #006747;
  --green-dark: #004d35;
  --green-mid: #005a3d;
  --green-light: #e8f4ef;
  --gold: #C9A84C;
  --gold-light: #f0d98a;
  --gold-dark: #9a7a2e;
  --cream: #f7f3eb;
  --cream-dark: #ede7d8;
  --white: #ffffff;
  --dark: #1a1a1a;
  --gray: #666;
  --gray-light: #999;
  --border: #ddd;
  --t1: #1a4a8a;
  --t2: #7a1a1a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Georgia, 'Times New Roman', serif;
  background: var(--cream);
  color: var(--dark);
  min-height: 100vh;
  font-size: 15px;
}

/* ─── HEADER ─── */
.site-header {
  background: var(--green);
  color: var(--white);
  text-align: center;
  padding: 18px 20px 14px;
  border-bottom: 5px solid var(--gold);
  position: relative;
}
.site-header .year-tag {
  position: absolute; top: 18px; right: 24px;
  background: var(--gold); color: var(--green-dark);
  font-size: 1em; font-weight: bold;
  padding: 4px 12px; border-radius: 20px; letter-spacing: 1px;
}
.conn-status {
  position: absolute; top: 20px; left: 20px;
  font-size: .78em; color: rgba(255,255,255,.5);
  letter-spacing: .5px;
}
.site-logo-wrap {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: var(--white);
  border: 3px solid var(--gold);
  box-shadow: 0 3px 12px rgba(0,0,0,.35);
  overflow: hidden;
  margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
}
.site-logo-wrap img {
  width: 88%; height: 88%;
  object-fit: contain;
  display: block;
}
.site-header h1 {
  font-size: 2em; letter-spacing: 3px;
  color: var(--gold); text-shadow: 1px 2px 4px rgba(0,0,0,.4);
  margin-bottom: 4px;
}
.site-header .subtitle {
  font-size: .9em; color: rgba(255,255,255,.75); font-style: italic;
}
.site-header .gbi-abbr {
  font-size: .8em; color: var(--gold-light); letter-spacing: 2px; margin-top: 2px;
}

/* ─── NAV TABS ─── */
.tab-nav {
  background: var(--green-dark);
  display: flex; overflow-x: auto;
  border-bottom: 3px solid var(--gold);
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 11px 18px;
  background: none; border: none; border-bottom: 3px solid transparent;
  margin-bottom: -3px;
  color: rgba(255,255,255,.65);
  cursor: pointer; font-family: Georgia, serif; font-size: .9em;
  white-space: nowrap; transition: color .2s, border-color .2s;
}
.tab-btn:hover { color: var(--gold-light); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(255,255,255,.07); }

/* ─── CONTENT AREA ─── */
.tab-pane { display: none; padding: 22px 20px; max-width: 1260px; margin: 0 auto; }
.tab-pane.active { display: block; }

/* ─── CARDS ─── */
.card {
  background: var(--white); border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.09);
  margin-bottom: 18px; overflow: hidden;
}
.card-header {
  background: var(--green); color: var(--white);
  padding: 11px 16px; font-size: 1em; font-weight: bold;
  letter-spacing: .5px; display: flex; align-items: center;
  justify-content: space-between; gap: 8px;
}
.card-header .badge-gold { color: var(--gold); }
.card-body { padding: 16px; }
.card-subheader {
  background: var(--green-light); padding: 8px 16px;
  font-size: .85em; color: var(--green-dark); font-weight: bold;
  letter-spacing: .3px; border-bottom: 1px solid var(--border);
}

/* ─── TABLES ─── */
table { width: 100%; border-collapse: collapse; font-size: .88em; }
thead th {
  background: var(--green); color: var(--gold);
  padding: 9px 11px; text-align: left; font-size: .82em;
  letter-spacing: .4px; white-space: nowrap;
}
th.c, td.c { text-align: center; }
tbody tr:nth-child(even) { background: #f8f5f0; }
tbody tr:hover { background: #edf5f0; }
td { padding: 8px 11px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
.sb-table td { padding: 8px 6px; }
.sb-table th { padding-left: 6px; padding-right: 6px; }

/* ─── RANK BADGES ─── */
.rank {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--green); color: var(--white);
  font-size: .8em; font-weight: bold;
}
.rank.gold { background: var(--gold); color: var(--white); }

/* ─── TEAM BADGES ─── */
.tb {
  display: inline-block; padding: 3px 9px; border-radius: 12px;
  font-size: .76em; font-weight: bold; color: var(--white);
  white-space: nowrap;
}
.tb-none { background: #888; }

/* ─── MATCHUP BLOCK ─── */
.matchup {
  display: grid; grid-template-columns: 1fr 52px 1fr;
  gap: 16px; align-items: center; text-align: center;
  padding: 16px 0;
}
.team-block {
  background: var(--green); color: var(--white);
  border-radius: 12px; padding: 18px 12px;
}
.team-block.leading { border: 3px solid var(--gold); }
.t-name { font-size: 1.1em; color: var(--gold); font-weight: bold; margin-bottom: 6px; }
.t-pts { font-size: 2.8em; font-weight: bold; line-height: 1; }
.t-sub { font-size: .78em; color: rgba(255,255,255,.65); margin-top: 6px; }
.vs-mid { font-size: 1.8em; font-weight: bold; color: var(--green); font-style: italic; }

/* ─── ALERTS ─── */
.alert {
  padding: 11px 15px; border-radius: 6px;
  margin-bottom: 14px; font-size: .88em; line-height: 1.5;
}
.alert-gold { background: #fff8e1; border-left: 4px solid var(--gold); color: #5a420a; }
.alert-green { background: var(--green-light); border-left: 4px solid var(--green); color: var(--green-dark); }
.alert-info { background: #e3f1fb; border-left: 4px solid #1976d2; color: #0d3d6e; }
.alert-red { background: #fdeaea; border-left: 4px solid #c0392b; color: #6e1a12; }

/* ─── FORMS ─── */
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
label { font-size: .8em; color: var(--gray); font-weight: bold; letter-spacing: .3px; }
input[type="text"], input[type="number"], select {
  padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 5px; font-family: Georgia, serif; font-size: .9em;
  background: var(--white); transition: border-color .2s;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus {
  outline: none; border-color: var(--green);
  box-shadow: 0 0 0 2px rgba(0,103,71,.12);
}
input.score-in { width: 80px; text-align: center; }

/* ─── BUTTONS ─── */
.btn {
  padding: 8px 16px; border: none; border-radius: 5px;
  cursor: pointer; font-family: Georgia, serif;
  font-size: .88em; font-weight: bold; transition: all .18s;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn-green { background: var(--green); color: var(--white); }
.btn-green:hover { background: var(--green-dark); }
.btn-gold { background: var(--gold); color: var(--white); }
.btn-gold:hover { background: var(--gold-dark); }
.btn-red { background: #c0392b; color: var(--white); }
.btn-red:hover { background: #a02820; }
.btn-sm { padding: 4px 10px; font-size: .78em; }
.btn-xs { padding: 3px 8px; font-size: .72em; }

/* ─── PLAYER CHIPS ─── */
.chip-pool {
  display: flex; flex-wrap: wrap; gap: 7px;
  padding: 11px; background: #f2ede3;
  border-radius: 7px; min-height: 52px;
  border: 2px dashed #ccc;
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 16px;
  background: var(--white); border: 2px solid var(--border);
  font-size: .85em; cursor: pointer;
  transition: all .18s; user-select: none; white-space: nowrap;
}
.chip:hover { border-color: var(--green); }
.chip.t1 { background: #e8f0fb; border-color: var(--t1); color: var(--t1); }
.chip.t2 { background: #fbe8e8; border-color: var(--t2); color: var(--t2); }

/* ─── GROUP / MATCH PANELS ─── */
.gpanel {
  border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 12px; overflow: hidden;
}
.gpanel-head {
  background: var(--green); color: var(--white);
  padding: 8px 12px;
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 8px;
  border-bottom: 2px solid var(--green-dark); font-weight: bold; font-size: .88em;
  font-family: 'Cinzel', Georgia, serif; letter-spacing: .3px;
}
.gpanel-head-mid {
  text-align: center; font-size: .8em; color: var(--gold-light);
  font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gpanel-head-right {
  display: flex; align-items: center; font-size: .8em;
  color: rgba(255,255,255,.65); font-weight: normal; white-space: nowrap;
}
.gpanel-head-right input {
  background: rgba(0,0,0,.2); border-color: rgba(255,255,255,.2);
  color: rgba(255,255,255,.85);
}
.gpanel-body { padding: 8px; }
.gpanel select { font-size: .78em; padding: 4px 5px; }
.gpanel label  { font-size: .72em; }
/* 4-man 2×2 + score box layout */
.group-layout {
  display: grid; grid-template-columns: 1fr 1fr 88px;
  gap: 8px; align-items: stretch;
}
.group-col { display: flex; flex-direction: column; gap: 6px; }
.group-col .form-group { gap: 2px; }
.group-score-box {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 5px;
  background: #f2ede3; border-radius: 6px;
  border: 2px solid var(--border); padding: 8px; text-align: center;
}
.group-score-box label { font-size: .72em; color: var(--gray); font-weight: bold; margin: 0; letter-spacing: .3px; }
.group-score-box input { width: 62px; font-size: 1.15em; text-align: center; }
.match-sides {
  display: grid; grid-template-columns: 1fr 44px 1fr;
  gap: 14px; align-items: start;
}
.side-t1 { background: #edf2fb; padding: 11px; border-radius: 7px; border: 2px solid rgba(26,74,138,.25); }
.side-t2 { background: #fbedee; padding: 11px; border-radius: 7px; border: 2px solid rgba(122,26,26,.25); }
.side-label { font-weight: bold; margin-bottom: 8px; font-size: .9em; }
.vs-center { display: flex; align-items: center; justify-content: center; font-size: 1.4em; font-weight: bold; color: var(--green); font-style: italic; padding-top: 30px; }

/* ─── PAYOUT CATEGORY COLORS ─── */
.cat { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .75em; font-weight: bold; }
.cat-LD  { background: #fde8e8; color: #b03030; }
.cat-C2P { background: #e8f0fd; color: #2060a0; }
.cat-LP  { background: #f0e8fd; color: #7030a0; }
.cat-NP  { background: #f0f0f0; color: #888; }

/* ─── COLOR HELPERS ─── */
.green  { color: var(--green); }
.gold   { color: var(--gold-dark); }
.money  { color: #1a7a1a; font-weight: bold; }
.pts    { color: var(--green); font-weight: bold; }
.hi     { color: var(--gold-dark); font-weight: bold; }

/* ─── SECTION HEADER ─── */
.sec-head {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 0 12px; padding-bottom: 7px;
  border-bottom: 2px solid var(--green);
}
.sec-head h3 { font-size: 1.1em; color: var(--green-dark); }

/* ─── STAT BOXES ─── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 14px; }
.stat-box {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
}
.stat-box .slabel { font-size: .72em; color: var(--gray); margin-bottom: 3px; }
.stat-box .sval { font-size: 1.5em; font-weight: bold; color: var(--green); }
.stat-box .ssub { font-size: .75em; color: var(--gray-light); }

/* ─── FORMAT TABLE ─── */
.fmt-table { width: 100%; border-collapse: collapse; font-size: .87em; margin-top: 6px; }
.fmt-table th { background: var(--green); color: var(--gold); padding: 7px 11px; text-align: left; }
.fmt-table td { padding: 7px 11px; border-bottom: 1px solid var(--border); }
.fmt-table tbody tr:last-child td { border-bottom: none; }

/* ─── TWO-COL LAYOUT ─── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* ─── WINNER ROW ─── */
tr.winner td:first-child { border-left: 3px solid var(--gold); }
tr.winner { background: #fffce8 !important; }

/* ─── SAVE TOAST ─── */
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--green); color: var(--white);
  padding: 9px 18px; border-radius: 20px; font-size: .83em;
  opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none;
}
#toast.show { opacity: 1; }

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center; padding: 32px 20px;
  color: var(--gray-light); font-style: italic;
}
.empty .eicon { font-size: 2.4em; margin-bottom: 8px; }

/* ─── RESPONSIVE ─── */
@media (max-width: 720px) {
  .two-col, .three-col { grid-template-columns: 1fr; }
  .matchup { grid-template-columns: 1fr; }
  .vs-mid { display: none; }
  .match-sides { grid-template-columns: 1fr; }
  .vs-center { display: none; }
  .site-header h1 { font-size: 1.4em; }
  .hide-mobile { display: none !important; }
  /* tighter tables on mobile */
  table { font-size: .78em; }
  td, th { padding: 5px 5px; }
  thead th { font-size: .72em; letter-spacing: 0; }
  /* hide day-results breakdown cols on mobile — total tells the story */
  .hide-phone { display: none !important; }
  .tab-pane { padding: 12px 10px; }
}

/* ─── SEARCH HIGHLIGHT ─── */
.player-result-card {
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 12px;
}
.player-result-head {
  padding: 10px 14px; color: var(--white); font-weight: bold;
  display: flex; align-items: center; justify-content: space-between;
}
.player-result-body { padding: 12px 14px; }

/* progress bar */
.prog-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin: 4px 0; }
.prog-fill { height: 100%; border-radius: 3px; transition: width .4s; }

/* ─── COMPACT TEAM BANNER ─── */
.team-compact-banner {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 8px; margin-bottom: 14px; align-items: stretch;
}
.tcb-side {
  border-radius: 8px; padding: 12px 16px; text-align: center; color: white;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.tcb-name  { font-size: .8em; letter-spacing: .5px; opacity: .8; margin-bottom: 4px; }
.tcb-score { font-size: 2em; font-weight: bold; line-height: 1; }
.tcb-mid   { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0 4px; }
.tcb-vs    { font-weight: bold; color: var(--green-dark); font-size: 1em; }
.tcb-margin { font-size: .68em; color: var(--gray); font-style: italic; text-align: center; line-height: 1.3; }

/* ─── BIG BOARD ─── */
.big-board {
  background: #f7f4ec; border: 3px solid #1a3a1a;
  border-radius: 4px; overflow: hidden;
  font-family: 'Cinzel', Georgia, serif;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
}
.bb-title-bar {
  background: var(--gold); padding: 13px 20px; text-align: center;
  border-bottom: 3px solid #1a3a1a;
}
.bb-tournament { color: #1a3a1a; font-size: 1.1em; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; }
.bb-year       { color: rgba(0,0,0,.45); font-size: .72em; letter-spacing: 3px; margin-top: 3px; }
.bb-cols {
  display: grid; grid-template-columns: 52px 1fr 72px 72px;
  padding: 7px 16px; background: var(--green);
  border-bottom: 2px solid #1a3a1a;
  font-size: .68em; color: rgba(255,255,255,.85);
  letter-spacing: 1.5px; text-transform: uppercase;
}
.bb-cols .c { text-align: center; }
.bb-row {
  display: grid; grid-template-columns: 52px 1fr 72px 72px;
  align-items: center; padding: 10px 16px;
  border-bottom: 1px solid #d4c9a8;
}
.bb-row:nth-child(even) { background: #f0ece0; }
.bb-row.bb-top { background: #fdf8e8 !important; border-left: 4px solid var(--gold); }
.bb-pos      { font-size: .85em; color: #666; }
.bb-pos.bb-gold { color: var(--gold-dark); font-weight: 700; }
.bb-name     { font-size: .9em; font-weight: 600; color: #111; padding-left: 10px; border-left: 4px solid transparent; }
.bb-pts      { font-size: 1.5em; font-weight: 900; text-align: center; color: #111; font-family: 'Cinzel', Georgia, serif; line-height: 1; }
.bb-par      { font-size: .8em; text-align: center; line-height: 1.3; }
.bb-par.under { color: #cc0000; font-weight: 700; }
.bb-par.even  { color: #222; font-weight: 600; }
.bb-par.over  { color: #888; }
.bb-par.none  { color: #ccc; }
.bb-view-btn { display: flex; justify-content: flex-end; margin-bottom: 12px; }
@media(max-width:520px) {
  .bb-cols, .bb-row { grid-template-columns: 38px 1fr 60px 60px; padding-left: 10px; padding-right: 10px; }
}

/* ─── MATCH ARENA (2v2 redesign) ─── */
.match-arena {
  display: grid; grid-template-columns: 1fr 38px 1fr;
}
.match-side { padding: 8px; display: flex; flex-direction: column; gap: 5px; }
.match-side.match-winner { background: linear-gradient(135deg,#f0faf3,#e4f5e8); }
.ms-header {
  color: white; padding: 4px 7px; border-radius: 4px;
  font-size: .76em; font-weight: bold; text-align: center; letter-spacing: .3px;
}
.ms-pts { font-size: .76em; color: var(--green); font-weight: bold; margin-top: 1px; }
.match-divider {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px;
  background: #f2ede3; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  font-size: .88em; font-weight: bold; color: var(--green-dark);
}
/* keep side-by-side on all screen sizes — names are short enough */
.match-arena select { font-size: .78em; padding: 4px 5px; }
.match-arena label  { font-size: .72em; }
.match-arena input.score-in { width: 60px; font-size: .85em; padding: 5px; }

/* ─── COUNTDOWN ─── */
.cd-wrap { display:flex; justify-content:center; gap:12px; margin-bottom:10px; }
.cd-unit { text-align:center; }
.cd-num  { font-family:'DM Mono',monospace; font-size:2.2em; font-weight:700; color:var(--gold); line-height:1; }
.cd-label{ font-size:.68em; color:var(--gray-light); letter-spacing:1.5px; text-transform:uppercase; margin-top:3px; }
.cd-sep  { font-size:2em; font-weight:bold; color:var(--gold-dark); align-self:flex-start; padding-top:4px; }
.cd-sub  { text-align:center; font-size:.78em; color:var(--gray-light); margin-top:4px; font-style:italic; }
.cd-live { text-align:center; font-size:1.3em; font-weight:bold; color:var(--green); padding:12px 0; }

/* ─── PP ZONE ─── */
.pp-zone-header { background:#8b1a1a !important; }
.pp-row { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid #f5c6c6; }
.pp-row:last-child { border-bottom:none; }
.pp-rank { font-size:1.3em; min-width:28px; }
.pp-name { flex:1; font-weight:bold; font-size:.9em; }
.pp-pts  { font-family:'DM Mono',monospace; font-size:.88em; color:#8b1a1a; font-weight:bold; }

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
// Returns 1-based rank per score (lower score = better). Tied scores share
// the same rank (the top position of the tied block, e.g. two ties at 1st
// both get rank 1, the next unique score gets rank 3).
function rank(scores) {
  return scores.map((s, _, arr) => {
    if (s === '' || s === null) return null;
    const v = parseFloat(s);
    if (isNaN(v)) return null;
    const better = arr.filter(x => x !== '' && x !== null && !isNaN(parseFloat(x)) && parseFloat(x) < v).length;
    return better + 1;
  });
}

// Points for myRank, averaging across all tied positions in the table.
// e.g. two tied at rank 1 in a [8,6,4,2,1] table → (8+6)/2 = 7 each.
function rankedPts(table, allRanks, myRank) {
  if (myRank === null) return 0;
  const tiedCount = allRanks.filter(r => r === myRank).length;
  let total = 0;
  for (let i = myRank - 1; i < myRank - 1 + tiedCount && i < table.length; i++) {
    total += table[i];
  }
  return tiedCount > 0 ? total / tiedCount : 0;
}

// Ordinal suffix: 1 → "1st", 2 → "2nd", etc.
function ordinal(n) {
  if (n === null) return '—';
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function fourManPoints(day) {
  const scores = S[day].groups.map(g => g.score);
  const ranks  = rank(scores);
  return ranks.map(r => r === null ? null : rankedPts(SC[day].fourMan, ranks, r));
}

function matchResults(day) {
  const matches = S[day].matches;
  const sc = SC[day];
  const allScores = [];
  matches.forEach(m => { allScores.push(m.score1); allScores.push(m.score2); });
  const ranks = rank(allScores);

  return matches.map((m, i) => {
    const s1 = m.score1, s2 = m.score2;
    const r1 = ranks[i*2], r2 = ranks[i*2+1];
    let w1 = 0, w2 = 0;
    if (s1 !== '' && s2 !== '' && s1 !== null && s2 !== null && !isNaN(parseFloat(s1)) && !isNaN(parseFloat(s2))) {
      const v1 = parseFloat(s1), v2 = parseFloat(s2);
      if (v1 < v2)      { w1 = sc.matchWin; }
      else if (v2 < v1) { w2 = sc.matchWin; }
      else              { w1 = sc.matchTie; w2 = sc.matchTie; }
    }
    const rk1 = rankedPts(sc.matchRank, ranks, r1);
    const rk2 = rankedPts(sc.matchRank, ranks, r2);
    return {
      p1: { rank: r1, win: w1, rankPts: rk1, total: w1 + rk1 },
      p2: { rank: r2, win: w2, rankPts: rk2, total: w2 + rk2 }
    };
  });
}

function playerStats(name) {
  const st = { name, team: teamOf(name),
    d1: { fourMan:0, matchWin:0, matchRank:0, payout:0, total:0, money:0 },
    d2: { fourMan:0, matchWin:0, matchRank:0, payout:0, total:0, money:0 },
    total:0, money:0 };

  ['day1','day2'].forEach(day => {
    const dk = day === 'day1' ? 'd1' : 'd2';
    const fmPts = fourManPoints(day);
    S[day].groups.forEach((g,gi) => {
      if (g.players.includes(name)) st[dk].fourMan = fmPts[gi] || 0;
    });
    const mrs = matchResults(day);
    S[day].matches.forEach((m,mi) => {
      const r = mrs[mi];
      if ([m.p1a, m.p1b].includes(name)) { st[dk].matchWin = r.p1.win; st[dk].matchRank = r.p1.rankPts; }
      if ([m.p2a, m.p2b].includes(name)) { st[dk].matchWin = r.p2.win; st[dk].matchRank = r.p2.rankPts; }
    });
    S[day].payouts.forEach(p => {
      if (p.cat !== 'NP' && p.winner === name) {
        st[dk].payout += SC.payoutPts;
        st[dk].money  += SC.payoutMoney;
      }
    });
    st[dk].total = st[dk].fourMan + st[dk].matchWin + st[dk].matchRank + st[dk].payout;
  });
  st.total = st.d1.total + st.d2.total;
  st.money = st.d1.money + st.d2.money;
  return st;
}

function allPlayerStats() {
  return PLAYERS.map(n => playerStats(n)).sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
}

function teamTotals() {
  let r = { t1: {name:S.teams.t1.name, d1:0, d2:0, total:0}, t2: {name:S.teams.t2.name, d1:0, d2:0, total:0} };
  S.roster.forEach(p => {
    if (!p.team) return;
    const s = playerStats(p.name);
    r[p.team].d1    += s.d1.total;
    r[p.team].d2    += s.d2.total;
    r[p.team].total += s.total;
  });
  return r;
}

function teamOf(name) {
  const p = S.roster.find(r => r.name === name);
  return p ? p.team : null;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Returns {set: bottom-5 names, last: dead-last name} when scores exist
function ppPlayers() {
  const all = allPlayerStats();
  if (!all.some(p => p.total > 0)) return { set: new Set(), last: null };
  const sorted = [...all].sort((a,b) => a.total - b.total);
  return { set: new Set(sorted.slice(0,5).map(p => p.name)), last: sorted[0].name };
}
// 🍆 for dead last, ⚠️ for the other bottom 4
function ppBadge(name, pp) {
  if (!pp || !pp.set.has(name)) return '';
  return ` <span style="font-size:.78em">${name === pp.last ? '&#127814;' : '&#9888;&#65039;'}</span>`;
}
// Red DM Mono pts for PP Zone players, normal green otherwise
function ppPts(name, pp, val) {
  if (pp && pp.set.has(name))
    return `<strong style="color:#8b1a1a;font-family:'DM Mono',monospace">${fmt(val)}</strong>`;
  return `<strong class="pts">${fmt(val)}</strong>`;
}
function flag(name) {
  const f = name === 'Trevor' ? '🇪🇬' : '🇺🇸';
  return `<span style="font-size:.65em;vertical-align:middle">${f}</span>`;
}
function jsq(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function fmt(n) {
  if (n === null || n === undefined || n === '') return '—';
  const v = parseFloat(n);
  if (isNaN(v)) return '—';
  return v % 1 === 0 ? String(v) : v.toFixed(1);
}
function fmtM(n) { return n ? `$${n}` : '$0'; }

function tBadge(team) {
  if (!team) return `<span class="tb tb-none">Unassigned</span>`;
  const t = S.teams[team];
  return `<span class="tb" style="background:${esc(t.color)}">${esc(t.name)}</span>`;
}

function playerOpts(val='') {

}

function playerScoreToPar(name) {
  let total = 0, count = 0;
  ['day1','day2'].forEach(day => {
    S[day].groups.forEach(g => {
      if (g.players.includes(name) && g.score !== '' && !isNaN(parseFloat(g.score))) {
        total += parseFloat(g.score); count++;
      }
    });
    S[day].matches.forEach(m => {
      if ([m.p1a,m.p1b].includes(name) && m.score1 !== '' && !isNaN(parseFloat(m.score1))) {
        total += parseFloat(m.score1); count++;
      }
      if ([m.p2a,m.p2b].includes(name) && m.score2 !== '' && !isNaN(parseFloat(m.score2))) {
        total += parseFloat(m.score2); count++;
      }
    });
  });
  return count > 0 ? total : null;
}

function fmtPar(n) {
  if (n === null) return '—';
  if (n === 0) return 'E';
  return (n > 0 ? '+' : '') + n;
}

  const el = document.getElementById('psearch-results');
  if (!q.trim()) { el.innerHTML=''; return; }
  const hits = S.roster.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
  if (!hits.length) { el.innerHTML='<p style="color:#888">No matching players.</p>'; return; }
  el.innerHTML = hits.map(p => {
    const st = playerStats(p.name);
    const tc = p.team ? S.teams[p.team].color : '#888';
    return `<div class="player-result-card">
      <div class="player-result-head" style="background:${tc}">
        <span>${esc(p.name)}</span>
        ${tBadge(p.team)}
      </div>
      <div class="player-result-body">
        <div class="stat-grid">
          <div class="stat-box"><div class="slabel">Total Points</div><div class="sval">${fmt(st.total)}</div></div>
          <div class="stat-box"><div class="slabel">Total Winnings</div><div class="sval money">${fmtM(st.money)}</div></div>
          <div class="stat-box"><div class="slabel">Day 1 Points</div><div class="sval">${fmt(st.d1.total)}</div><div class="ssub">${fmtM(st.d1.money)} earned</div></div>
          <div class="stat-box"><div class="slabel">Day 2 Points</div><div class="sval">${fmt(st.d2.total)}</div><div class="ssub">${fmtM(st.d2.money)} earned</div></div>
        </div>
        <table style="font-size:.82em">
          <thead><tr><th></th><th class="c">4-Man</th><th class="c">2v2 Win</th><th class="c">2v2 Rank</th><th class="c">Payouts</th><th class="c">Total</th><th class="c">$</th></tr></thead>
          <tbody>
            <tr><td><strong>Day 1</strong></td><td class="c">${fmt(st.d1.fourMan)}</td><td class="c">${fmt(st.d1.matchWin)}</td><td class="c">${fmt(st.d1.matchRank)}</td><td class="c">${fmt(st.d1.payout)}</td><td class="c pts">${fmt(st.d1.total)}</td><td class="c money">${fmtM(st.d1.money)}</td></tr>
            <tr><td><strong>Day 2</strong></td><td class="c">${fmt(st.d2.fourMan)}</td><td class="c">${fmt(st.d2.matchWin)}</td><td class="c">${fmt(st.d2.matchRank)}</td><td class="c">${fmt(st.d2.payout)}</td><td class="c pts">${fmt(st.d2.total)}</td><td class="c money">${fmtM(st.d2.money)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════
   DAY SCORECARD
═══════════════════════════════════════════════════════ */
function updateTabLockBadges() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const oc = btn.getAttribute('onclick');
    if (oc === "tab('day1')") btn.innerHTML = '&#9971; Day 1' + (S.locks?.day1 ? ' &#128274;' : '');
    if (oc === "tab('day2')") btn.innerHTML = '&#9971; Day 2' + (S.locks?.day2 ? ' &#128274;' : '');
  });
}

function lockDay(day) {
  const label = day === 'day1' ? 'Day 1' : 'Day 2';
  const pin = prompt(`Enter commissioner PIN to lock ${label}:`);
  if (pin === null) return;
  if (pin.trim().toUpperCase() !== ADMIN_PIN.toUpperCase()) { alert('Incorrect PIN.'); return; }
  if (!S.locks) S.locks = {};
  S.locks[day] = true;
  save();
  renderDay(day);
  updateTabLockBadges();
}

function unlockDay(day) {
  const label = day === 'day1' ? 'Day 1' : 'Day 2';
  const pin = prompt(`Enter commissioner PIN to unlock ${label}:`);
  if (pin === null) return;
  if (pin.trim().toUpperCase() !== ADMIN_PIN.toUpperCase()) { alert('Incorrect PIN.'); return; }
  if (!S.locks) S.locks = {};
  S.locks[day] = false;
  save();
  renderDay(day);
  updateTabLockBadges();
}

function renderDay(day) {
  const el = document.getElementById('pane-'+day);
  const label = day==='day1' ? 'Day 1' : 'Day 2';
  const locked = !!(S.locks && S.locks[day]);
  const sc = SC[day];
  const fmPts  = fourManPoints(day);
  const fmRanks = rank(S[day].groups.map(g => g.score));
  const mrs = matchResults(day);
  const tt = teamTotals();
  const td = day==='day1' ? {t1:tt.t1.d1,t2:tt.t2.d1} : {t1:tt.t1.d2,t2:tt.t2.d2};

  // Team day total header
  const dayMargin = Math.abs(td.t1 - td.t2);
  const dayLeadName = td.t1 > td.t2 ? S.teams.t1.name : td.t2 > td.t1 ? S.teams.t2.name : null;
  const dayMid = dayLeadName ? `${esc(dayLeadName)} +${fmt(dayMargin)}` : (td.t1+td.t2>0?'Tied':'&mdash;');
  let html = `
  <div class="team-compact-banner" style="margin-bottom:10px">
    <div class="tcb-side" style="background:${esc(S.teams.t1.color)}">
      <div class="tcb-name">${esc(S.teams.t1.name)}</div>
      <div class="tcb-score">${fmt(td.t1)}</div>
    </div>
    <div class="tcb-mid">
      <div class="tcb-vs">${label}</div>
      <div class="tcb-margin">${dayMid}</div>
    </div>
    <div class="tcb-side" style="background:${esc(S.teams.t2.color)}">
      <div class="tcb-name">${esc(S.teams.t2.name)}</div>
      <div class="tcb-score">${fmt(td.t2)}</div>
    </div>
  </div>
  <details style="margin-bottom:10px">
    <summary style="font-size:.8em;color:var(--gray);cursor:pointer;padding:4px 8px;list-style:none;display:flex;align-items:center;gap:6px">
      <span style="border:1px solid var(--border);border-radius:10px;padding:2px 10px;font-size:.95em">&#9432; Scoring guide</span>
    </summary>
    <div class="alert alert-gold" style="margin-top:6px;font-size:.83em">
      Enter group scores for the 4-Man Scramble, then pair scores for the 2v2. Points calculate automatically.
      1st=${sc.fourMan[0]}, 2nd=${sc.fourMan[1]}, 3rd=${sc.fourMan[2]}, 4th=${sc.fourMan[3]}, 5th=${sc.fourMan[4]} pts &nbsp;&middot;&nbsp; Match win +${sc.matchWin}, tie +${sc.matchTie}
    </div>
  </details>`;
  html += `
  <div class="sec-head" style="cursor:pointer;justify-content:space-between;user-select:none" onclick="toggleCollapse('${day}_four','${day}')">
    <h3>&#9971; 4-Man Scramble &mdash; ${label}</h3>
    <span style="font-size:.8em;color:var(--green);border:1px solid var(--green);padding:2px 10px;border-radius:12px">${_collapsed[day+'_four']===false?'&#9650; Hide':'&#9660; Show'}</span>
  </div>`;
  if (_collapsed[day+'_four'] === false) {
  html += `<div class="alert alert-info">Five groups of 4 players. Enter each group&rsquo;s score vs par (e.g. <strong>-5</strong>). Points: 1st=${sc.fourMan[0]}, 2nd=${sc.fourMan[1]}, 3rd=${sc.fourMan[2]}, 4th=${sc.fourMan[3]}, 5th=${sc.fourMan[4]}. Ties average the tied positions.</div>`;

  // 4-Man groups — build set of all already-chosen players for this day
  const usedInDay = new Set(S[day].groups.flatMap(g => g.players.filter(p => p !== '')));

  S[day].groups.forEach((g,gi) => {
    const pts = fmPts[gi];

    // Build one player slot: filters out players already used in other slots
    const makeGSlot = pi => {
      const cur = g.players[pi];
      const opts = PLAYERS.map(n => {
        if (usedInDay.has(n) && n !== cur) return '';
        return `<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`;
      }).join('');
      const t = cur ? teamOf(cur) : null;
      const badge = t
        ? `<span class="tb" style="background:${esc(S.teams[t].color)};display:inline-block;margin-top:4px">${esc(S.teams[t].name)}</span>`
        : `<span style="display:inline-block;height:22px;margin-top:4px"></span>`;
      return `<div class="form-group">
          <label>Player ${pi+1}</label>
          <select ${locked ? 'disabled' : `onchange="S.${day}.groups[${gi}].players[${pi}]=this.value;save();renderDay('${day}')"`}>
            <option value="">— Select —</option>${opts}
          </select>
          ${badge}
        </div>`;
    };

    html += `
  <div class="gpanel">
    <div class="gpanel-head">
      <span>Group ${g.id}</span>
      <span class="gpanel-head-mid">${pts!==null ? `${ordinal(fmRanks[gi])} Place &nbsp;&middot;&nbsp; Score ${g.score} &nbsp;&middot;&nbsp; <strong>${fmt(pts)} pts</strong>/player` : ''}</span>
      <span class="gpanel-head-right">
        <input type="text" value="${esc(g.teeTime)}" placeholder="Tee time" style="width:66px;font-size:.85em"
          ${locked ? 'disabled' : `onchange="S.${day}.groups[${gi}].teeTime=this.value;save()"`} />
      </span>
    </div>
    <div class="gpanel-body">
      <div class="group-layout">
        <div class="group-col">${makeGSlot(0)}${makeGSlot(1)}</div>
        <div class="group-col">${makeGSlot(2)}${makeGSlot(3)}</div>
        <div class="group-score-box">
          <label>Score<br>vs par</label>
          <input type="number" value="${esc(g.score)}" placeholder="—"
            ${locked ? 'disabled' : `onchange="S.${day}.groups[${gi}].score=this.value;save();renderDay('${day}')"`} />
          ${pts!==null?`<div style="font-size:.75em;color:var(--green);font-weight:bold">${fmt(pts)} pts</div>`:''}
        </div>
      </div>
    </div>
  </div>`;
  });

  } // end 4-man collapse

  html += `
  <div class="sec-head" style="cursor:pointer;justify-content:space-between;user-select:none" onclick="toggleCollapse('${day}_match','${day}')">
    <h3>&#127948; 2v2 Head-to-Head &mdash; ${label}</h3>
    <span style="font-size:.8em;color:var(--green);border:1px solid var(--green);padding:2px 10px;border-radius:12px">${_collapsed[day+'_match']===false?'&#9650; Hide':'&#9660; Show'}</span>
  </div>`;
  if (_collapsed[day+'_match'] === false) {
  html += `<div class="alert alert-info">Five matches: one pair from each team. Win = +${sc.matchWin} pts, Tie = +${sc.matchTie} pts per player. Plus rank points among all 10 pairs (lower score ranks higher).</div>`;

  // 2v2 matches — teams locked from roster, no duplicate picks across all 5 matches
  const usedInMatches = new Set(
    S[day].matches.flatMap(m => [m.p1a, m.p1b, m.p2a, m.p2b].filter(p => p !== ''))
  );
  const matchT1Pool = S.roster.filter(p => p.team === 't1').map(p => p.name);
  const matchT2Pool = S.roster.filter(p => p.team === 't2').map(p => p.name);

  if (matchT1Pool.length === 0 || matchT2Pool.length === 0) {
    html += `<div class="alert alert-red">⚠️ Teams are not fully assigned. Go to <strong>Roster &amp; Teams</strong> and assign all players before setting up matches.</div>`;
  }

  S[day].matches.forEach((m,mi) => {
    const r = mrs[mi];
    const s1 = m.score1 !== '' && m.score1 !== null ? parseFloat(m.score1) : null;
    const s2 = m.score2 !== '' && m.score2 !== null ? parseFloat(m.score2) : null;
    let winLabel = '';
    if (s1!==null && s2!==null && !isNaN(s1) && !isNaN(s2)) {
      const winner = s1 < s2 ? esc(S.teams.t1.name) : s2 < s1 ? esc(S.teams.t2.name) : null;
      winLabel = winner
        ? `<span class="hi">&#10003; ${winner} wins</span>`
        : `<span class="hi">Tied</span>`;
    }

    // Builds a team-filtered, dedup-safe select for one player slot
    const makeMSlot = (field, cur, pool) => {
      const opts = pool.map(n => {
        if (usedInMatches.has(n) && n !== cur) return '';
        return `<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`;
      }).join('');
      return `<select ${locked ? 'disabled' : `onchange="S.${day}.matches[${mi}].${field}=this.value;save();renderDay('${day}')"`}>
              <option value="">— Select —</option>${opts}
            </select>`;
    };

    const win1 = s1!==null && s2!==null && s1 < s2;
    const win2 = s1!==null && s2!==null && s2 < s1;
    const tied = s1!==null && s2!==null && s1 === s2;
    const dividerIcon = win1 ? '&#9668;' : win2 ? '&#9658;' : tied ? '&#61;' : 'VS';
    const dividerSub  = win1 ? esc(S.teams.t1.name) : win2 ? esc(S.teams.t2.name) : tied ? 'Tied' : '';

    html += `
  <div class="gpanel">
    <div class="gpanel-head">
      <span>Match ${m.id}</span>
      <span class="gpanel-head-mid">${winLabel}</span>
      <span class="gpanel-head-right">
        <input type="text" value="${esc(m.teeTime)}" placeholder="Tee time" style="width:66px;font-size:.85em"
          ${locked ? 'disabled' : `onchange="S.${day}.matches[${mi}].teeTime=this.value;save()"`} />
      </span>
    </div>
    <div class="match-arena">
      <div class="match-side${win1?' match-winner':''}">
        <div class="ms-header" style="background:${esc(S.teams.t1.color)}">${win1?'&#127942; ':''}${esc(S.teams.t1.name)}</div>
        <div class="form-group">
          <label>Player 1</label>${makeMSlot('p1a', m.p1a, matchT1Pool)}
        </div>
        <div class="form-group">
          <label>Player 2</label>${makeMSlot('p1b', m.p1b, matchT1Pool)}
        </div>
        <div class="form-group">
          <label>Score (vs par)</label>
          <input type="number" class="score-in" value="${esc(m.score1)}" placeholder="&mdash;"
            ${locked ? 'disabled' : `onchange="S.${day}.matches[${mi}].score1=this.value;save();renderDay('${day}')"`} />
        </div>
        ${r.p1.total ? `<div class="ms-pts"><strong>${fmt(r.p1.total)} pts</strong> &nbsp;<span style="color:#888;font-size:.9em">${ordinal(r.p1.rank)} overall &middot; +${fmt(r.p1.win)} win +${fmt(r.p1.rankPts)} rank</span></div>` : ''}
      </div>
      <div class="match-divider">
        <div style="font-size:1.3em">${dividerIcon}</div>
        <div style="font-size:.68em;color:#888;text-align:center;letter-spacing:.3px">${dividerSub}</div>
      </div>
      <div class="match-side${win2?' match-winner':''}">
        <div class="ms-header" style="background:${esc(S.teams.t2.color)}">${win2?'&#127942; ':''}${esc(S.teams.t2.name)}</div>
        <div class="form-group">
          <label>Player 1</label>${makeMSlot('p2a', m.p2a, matchT2Pool)}
        </div>
        <div class="form-group">
          <label>Player 2</label>${makeMSlot('p2b', m.p2b, matchT2Pool)}
        </div>
        <div class="form-group">
          <label>Score (vs par)</label>
          <input type="number" class="score-in" value="${esc(m.score2)}" placeholder="&mdash;"
            ${locked ? 'disabled' : `onchange="S.${day}.matches[${mi}].score2=this.value;save();renderDay('${day}')"`} />
        </div>
        ${r.p2.total ? `<div class="ms-pts"><strong>${fmt(r.p2.total)} pts</strong> &nbsp;<span style="color:#888;font-size:.9em">${ordinal(r.p2.rank)} overall &middot; +${fmt(r.p2.win)} win +${fmt(r.p2.rankPts)} rank</span></div>` : ''}
      </div>
    </div>
  </div>`;
  });
  } // end 2v2 collapse

  // Day results table
  html += `
  <div class="sec-head"><h3>📋 ${label} Player Results</h3></div>
  <div class="card"><div class="card-body">${renderDayTable(day)}</div></div>`;

  // Lock bar at the bottom
  html += locked
    ? `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff3cd;border:1px solid #e6c84a;border-radius:7px;padding:10px 14px;margin-top:10px">
        <span style="font-weight:bold;color:#7a5a00">&#128274; ${label} is locked — scores are final</span>
        <button class="btn btn-sm" style="background:#7a1a1a;color:white;font-size:.8em" onclick="unlockDay('${day}')">Unlock</button>
       </div>`
    : `<div style="display:flex;align-items:center;justify-content:flex-end;margin-top:10px">
        <button class="btn btn-sm" style="background:var(--green);color:white;font-size:.85em" onclick="lockDay('${day}')">&#128274; Lock ${label}</button>
       </div>`;

  el.innerHTML = html;
}

function renderDayTable(day) {
  const dk = day==='day1'?'d1':'d2';
  const rows = allPlayerStats().map(p=>({...p, dp:p[dk]})).sort((a,b)=>b.dp.total-a.dp.total||a.name.localeCompare(b.name));
  if (rows.every(r=>r.dp.total===0)) return `<div class="empty">No scores entered yet for this day.</div>`;
  const pp = ppPlayers();
  let html = `<table><thead><tr>
    <th>Rank</th><th>Player</th><th class="hide-phone">Team</th>
    <th class="c hide-phone">4-Man</th><th class="c hide-phone">Match W</th><th class="c hide-phone">Rank</th><th class="c hide-phone">Payouts</th>
    <th class="c">Total</th><th class="c">$</th>
  </tr></thead><tbody>`;
  let rk=1,prev=null;
  rows.forEach((p,i)=>{
    if (p.dp.total!==prev) rk=i+1;
    html+=`<tr${rk<=3?' class="winner"':''}>
      <td><span class="rank${rk<=3?' gold':''}">${rk}</span></td>
      <td><strong>${flag(p.name)} ${esc(p.name)}${ppBadge(p.name,pp)}</strong></td><td class="hide-phone">${tBadge(p.team)}</td>
      <td class="c hide-phone">${fmt(p.dp.fourMan)}</td>
      <td class="c hide-phone">${fmt(p.dp.matchWin)}</td>
      <td class="c hide-phone">${fmt(p.dp.matchRank)}</td>
      <td class="c hide-phone">${fmt(p.dp.payout)}</td>
      <td class="c">${ppPts(p.name,pp,p.dp.total)}</td>
      <td class="c money">${fmtM(p.dp.money)}</td>
    </tr>`;
    prev=p.dp.total;
  });
  return html+'</tbody></table>';
}

/* ═══════════════════════════════════════════════════════
   HOLE PAYOUTS
═══════════════════════════════════════════════════════ */
function renderPayouts() {
  const el = document.getElementById('pane-payouts');

  // Calc totals per player
  const totals = {};
  PLAYERS.forEach(n => { totals[n] = { wins:0, pts:0, money:0 }; });
  ['day1','day2'].forEach(day => {
    S[day].payouts.forEach(p => {
      if (p.cat!=='NP' && p.winner && totals[p.winner]) {
        totals[p.winner].wins++;
        totals[p.winner].pts += SC.payoutPts;
        totals[p.winner].money += SC.payoutMoney;
      }
    });
  });

  const d1won = S.day1.payouts.filter(p=>p.cat!=='NP'&&p.winner).length;
  const d2won = S.day2.payouts.filter(p=>p.cat!=='NP'&&p.winner).length;

  function holeTable(day, label) {
    const dayLocked = !!(S.locks && S.locks[day]);
    const won = day==='day1'?d1won:d2won;
    let t = `<div class="card">
      <div class="card-header">${label}
        <span class="badge-gold" style="font-size:.82em">${won}/20 assigned &nbsp;|&nbsp; $${won*20} of $400</span>
      </div>
      <div class="card-body">
      <table><thead><tr><th>Hole</th><th>Category</th><th>Winner</th><th class="c">Pts</th><th class="c">$</th></tr></thead><tbody>`;
    S[day].payouts.forEach((p,i) => {
      if (p.cat==='NP') {
        t += `<tr style="opacity:.55"><td>${p.hole}</td><td><span class="cat cat-NP">No Prize</span></td><td colspan="3" style="font-style:italic;color:#aaa">No payout this hole</td></tr>`;
      } else {
        const catLabel = p.cat==='LD'?'Long Drive':p.cat==='C2P'?'Closest to Pin':'Longest Putt';
        t += `<tr>
          <td><strong>Hole ${p.hole}</strong></td>
          <td><span class="cat cat-${p.cat}">${catLabel}</span></td>
          <td>
            <select ${dayLocked ? 'disabled' : `onchange="S.${day}.payouts[${i}].winner=this.value;save();renderPayouts()"`}>
              <option value="">— No winner —</option>${playerOpts(p.winner)}
            </select>
          </td>
          <td class="c">${p.winner?'<span class="pts">2</span>':'—'}</td>
          <td class="c">${p.winner?'<span class="money">$20</span>':'—'}</td>
        </tr>`;
      }
    });
    t += `</tbody></table>`;
    t += dayLocked
      ? `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff3cd;border-top:1px solid #e6c84a;padding:10px 14px;margin-top:8px;border-radius:0 0 6px 6px">
          <span style="font-weight:bold;color:#7a5a00;font-size:.9em">&#128274; ${label} is locked</span>
          <button class="btn btn-sm" style="background:#7a1a1a;color:white;font-size:.8em" onclick="unlockDay('${day}');renderPayouts()">Unlock</button>
         </div>`
      : `<div style="display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);margin-top:8px">
          <button class="btn btn-sm" style="background:var(--green);color:white;font-size:.8em" onclick="lockDay('${day}');renderPayouts()">&#128274; Lock ${label}</button>
         </div>`;
    t += `</div></div>`;
    return t;
  }

  const leaderRows = Object.entries(totals).filter(([n,s])=>s.wins>0).sort((a,b)=>b[1].money-a[1].money);

  let html = `
  <div class="alert alert-gold"><strong>Hole Payouts</strong> — $20 per hole, 40 total payout holes (20 per day). Total hole payout pot: <strong>$800</strong>. Categories: Long Drive (LD), Closest to Pin (C2P), Longest Putt (LP).</div>

  <div class="two-col">
    ${holeTable('day1','📅 Day 1 Hole Payouts')}
    ${holeTable('day2','📅 Day 2 Hole Payouts')}
  </div>

  <div class="card">
    <div class="card-header">💰 Hole Payout Leaderboard</div>
    <div class="card-body">`;

  if (!leaderRows.length) {
    html += `<div class="empty"><div class="eicon">💰</div>No hole winners assigned yet.</div>`;
  } else {
    html += `<table><thead><tr><th>Rank</th><th>Player</th><th>Team</th><th class="c">Holes Won</th><th class="c">Payout Pts</th><th class="c">Payout $</th></tr></thead><tbody>`;
    leaderRows.forEach(([name,s],i) => {
      html += `<tr${i<3?' class="winner"':''}>
        <td><span class="rank${i<3?' gold':''}">${i+1}</span></td>
        <td><strong>${esc(name)}</strong></td>
        <td>${tBadge(teamOf(name))}</td>
        <td class="c">${s.wins}</td>
        <td class="c pts">${s.pts}</td>
        <td class="c money">$${s.money}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div></div>`;
  el.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════
   MONIES
═══════════════════════════════════════════════════════ */
function renderMonies() {
  const el = document.getElementById('pane-monies');
  const all = allPlayerStats();
  const anyScores = all.some(p => p.total > 0);
  const tt = teamTotals();
  const mdl = rk => rk===1?'&#128081;':rk===2?'&#129352;':rk===3?'&#129353;':`<span class="rank">${rk}</span>`;

  // Ranked standings (same logic as scoreboard)
  let rkc = 1, prevTot = null;
  const ranked = [];
  all.forEach((p, i) => {
    if (p.total !== prevTot) rkc = i + 1;
    ranked.push({ ...p, rk: rkc });
    prevTot = p.total;
  });

  const PRIZE_AMOUNTS = [400, 200, 100];

  function finishPrize(name) {
    if (!anyScores) return 0;
    for (let pos = 1; pos <= 3; pos++) {
      const tied = ranked.filter(p => p.rk === pos);
      if (!tied.find(p => p.name === name)) continue;
      if (tied.length === 1) return PRIZE_AMOUNTS[pos - 1];
      let pool = 0;
      for (let i = 0; i < tied.length && (pos + i - 1) < 3; i++) pool += PRIZE_AMOUNTS[pos + i - 1];
      return Math.round(pool / tied.length);
    }
    return 0;
  }

  // Team champ
  const leadTeamKey = tt.t1.total > tt.t2.total ? 't1' : tt.t2.total > tt.t1.total ? 't2' : null;
  const leadTeamName = leadTeamKey ? tt[leadTeamKey].name : null;

  function teamPrize(name) {
    if (!anyScores || !leadTeamKey) return 0;
    const p = S.roster.find(r => r.name === name);
    return (p && p.team === leadTeamKey) ? 50 : 0;
  }

  // Hole payouts — split by day
  const holeDays = { day1: { claimed: 0, unclaimed: 0 }, day2: { claimed: 0, unclaimed: 0 } };
  ['day1','day2'].forEach(day => {
    S[day].payouts.forEach(p => {
      if (p.cat === 'NP') return;
      if (p.winner) holeDays[day].claimed += 20; else holeDays[day].unclaimed += 20;
    });
  });
  const claimedHole = holeDays.day1.claimed + holeDays.day2.claimed;
  const unclaimedHole = holeDays.day1.unclaimed + holeDays.day2.unclaimed;
  const totalHolePot = claimedHole + unclaimedHole || 800;

  // Pot totals for tracker bars
  const finishClaimed = anyScores ? PRIZE_AMOUNTS.reduce((sum, amt, i) => {
    const pos = i + 1;
    const tied = ranked.filter(p => p.rk === pos);
    return tied.length ? sum + amt : sum;
  }, 0) : 0;
  const d1rollover = (S.locks?.day1) ? holeDays.day1.unclaimed : 0;
  const d2rollover = (S.locks?.day2) ? holeDays.day2.unclaimed : 0;
  const totalRollover = d1rollover + d2rollover;
  const teamBaseClaimed = (anyScores && leadTeamKey) ? 500 : 0;
  const teamClaimed = teamBaseClaimed + totalRollover;
  const totalDistributed = claimedHole + finishClaimed + teamClaimed;
  const GRAND_TOTAL = 2000;

  function pctBar(claimed, total, color) {
    const pct = total > 0 ? Math.round((claimed / total) * 100) : 0;
    return `<div style="background:#e0e0e0;border-radius:5px;overflow:hidden;height:12px;margin:5px 0 3px">
      <div style="background:${color};height:100%;width:${pct}%;transition:width .4s"></div>
    </div><div style="font-size:.78em;color:#666">${pct}% &nbsp;&middot;&nbsp; <strong class="money">$${claimed}</strong> of $${total}</div>`;
  }

  // Names at each finish position (handles ties correctly with filter)
  function posNames(pos) {
    const tied = ranked.filter(p => p.rk === pos);
    if (!anyScores || !tied.length) return `<span style="color:#aaa;font-style:italic">TBD</span>`;
    const names = tied.map(p => `<strong>${flag(p.name)} ${esc(p.name)}</strong>`).join(' &amp; ');
    return tied.length > 1 ? `${names} <em style="color:#b07000;font-size:.85em">(tied — split)</em>` : names;
  }

  let html = '';

  // ── Grand Total Banner ──
  const potRows = [
    { label: '📅 Day 1 Hole Payouts', pot: 400,                   claimed: holeDays.day1.claimed + d1rollover, color: 'var(--green)' },
    { label: '📅 Day 2 Hole Payouts', pot: 400,                   claimed: holeDays.day2.claimed + d2rollover, color: 'var(--green)' },
    { label: '🎖️ Individual Prizes',  pot: 700,                   claimed: finishClaimed,                      color: '#c8a800'      },
    { label: '🏆 Team Championship',  pot: 500 + totalRollover,   claimed: teamClaimed,                        color: '#1a4a8a'      },
  ];
  html += `<div class="card" style="margin-bottom:10px">
    <div class="card-header">💰 Total Prize Pool — $${GRAND_TOTAL}</div>
    <div class="card-body" style="padding:12px 16px">
      ${pctBar(totalDistributed, GRAND_TOTAL, 'var(--green)')}
      <div style="font-size:.82em;color:#888;margin-top:2px">$${totalDistributed} distributed &nbsp;&middot;&nbsp; $${GRAND_TOTAL - totalDistributed} still in play</div>
      <details style="margin-top:6px">
        <summary style="font-size:.8em;color:var(--green);cursor:pointer;list-style:none;display:inline-block;padding:2px 8px;border:1px solid var(--green);border-radius:10px">Breakdown</summary>
        <table style="width:100%;border-collapse:collapse;margin-top:8px">
          ${potRows.map(r => {
            const slicePct = Math.round((r.pot / GRAND_TOTAL) * 100);
            const claimPct = r.pot > 0 ? Math.min(100, Math.round((r.claimed / r.pot) * 100)) : 0;
            return `<tr style="border-top:1px solid var(--border)">
              <td style="padding:7px 6px 7px 0;font-size:.88em;white-space:nowrap">${r.label}</td>
              <td style="padding:7px 4px;text-align:right;white-space:nowrap;font-size:.88em"><strong class="money">$${r.pot}</strong></td>
              <td style="padding:7px 4px;text-align:right;white-space:nowrap;font-size:.82em;color:#888">${slicePct}% of pot</td>
              <td style="padding:7px 0 7px 8px;width:120px">
                <div style="background:#e0e0e0;border-radius:4px;overflow:hidden;height:8px">
                  <div style="background:${r.color};height:100%;width:${claimPct}%;transition:width .4s"></div>
                </div>
                <div style="font-size:.72em;color:#888;margin-top:2px">$${r.claimed} / $${r.pot} (${claimPct}%)</div>
              </td>
            </tr>`;
          }).join('')}
        </table>
      </details>
    </div>
  </div>`;

  // ── Pot Tracker ──
  const detailsSummary = `<summary style="font-size:.8em;color:var(--green);cursor:pointer;list-style:none;display:inline-block;margin-top:5px;padding:2px 8px;border:1px solid var(--green);border-radius:10px">Details</summary>`;

  // Team details breakdown
  let teamWho = `<span style="color:#aaa;font-style:italic">TBD — no scores yet</span>`;
  if (anyScores && leadTeamKey) {
    const tColor = S.teams[leadTeamKey].color;
    const perPlayer = Math.round((500 + totalRollover) / 10);
    const teamPlayers = S.roster.filter(p => p.team === leadTeamKey).map(p => esc(p.name)).join(', ');
    const d1rollPct = d1rollover ? Math.round((d1rollover / 400) * 100) : 0;
    const d2rollPct = d2rollover ? Math.round((d2rollover / 400) * 100) : 0;
    teamWho = `<span class="tb" style="background:${esc(tColor)}">${esc(leadTeamName)}</span>
      <table style="margin-top:10px;font-size:.85em;border-collapse:collapse;width:100%;max-width:380px">
        <tr><td style="padding:3px 8px 3px 0;color:#666">🏆 Base prize</td><td class="money" style="text-align:right">$500</td><td style="color:#aaa;font-size:.85em;padding-left:8px">fixed</td></tr>
        ${d1rollover > 0 ? `<tr><td style="padding:3px 8px 3px 0;color:#1a7a1a">⛳ D1 rollover &#128274;</td><td class="money" style="text-align:right">+$${d1rollover}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${d1rollPct}% of D1 pot</td></tr>` : ''}
        ${d2rollover > 0 ? `<tr><td style="padding:3px 8px 3px 0;color:#1a7a1a">⛳ D2 rollover &#128274;</td><td class="money" style="text-align:right">+$${d2rollover}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${d2rollPct}% of D2 pot</td></tr>` : ''}
        <tr style="border-top:1px solid var(--border);font-weight:bold"><td style="padding:5px 8px 3px 0">Total pot</td><td class="money" style="text-align:right">$${500 + totalRollover}</td><td style="color:#888;font-size:.85em;padding-left:8px">$${perPlayer}/player</td></tr>
      </table>
      <div style="color:#666;font-size:.8em;margin-top:6px">→ ${teamPlayers}</div>`;
  }

  html += `<div class="card" style="margin-bottom:10px">
    <div class="card-header">🏆 Pot Tracker</div>
    <div class="card-body">

    <div style="margin-bottom:18px">
      <div style="font-weight:bold;margin-bottom:4px">🎖️ Individual Finish Prizes &mdash; $700</div>
      ${pctBar(finishClaimed, 700, '#c8a800')}
      <details style="margin-top:2px">${detailsSummary}
        <table style="width:100%;max-width:500px;margin-top:8px"><tbody>
          <tr><td style="width:28px">🥇</td><td style="width:60px"><strong class="money">$400</strong></td><td>${posNames(1)}</td></tr>
          <tr><td>🥈</td><td><strong class="money">$200</strong></td><td>${posNames(2)}</td></tr>
          <tr><td>🥉</td><td><strong class="money">$100</strong></td><td>${posNames(3)}</td></tr>
        </tbody></table>
      </details>
    </div>

    <div style="margin-bottom:18px">
      <div style="font-weight:bold;margin-bottom:4px">🏆 Team Championship &mdash; $${500 + totalRollover}</div>
      ${pctBar(teamClaimed, 500 + totalRollover, '#1a4a8a')}
      <details style="margin-top:2px">${detailsSummary}
        <div style="margin-top:6px">${teamWho}</div>
      </details>
    </div>

    ${['day1','day2'].map(day => {
      const hd = holeDays[day];
      const roll = day === 'day1' ? d1rollover : d2rollover;
      const dayLocked = !!(S.locks?.[day]);
      const dayLabel = day === 'day1' ? 'Day 1 Hole Payouts' : 'Day 2 Hole Payouts';
      const allocated = hd.claimed + roll;
      const claimedPct = Math.round((hd.claimed / 400) * 100);
      const rollPct = Math.round((roll / 400) * 100);
      const pendingPct = 100 - claimedPct - rollPct;
      const detailRows = `
        <table style="font-size:.85em;border-collapse:collapse;width:100%;max-width:380px;margin-top:6px">
          <tr><td style="padding:3px 8px 3px 0;color:#666">💵 Paid to players</td><td class="money" style="text-align:right">$${hd.claimed}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${claimedPct}% of pot</td></tr>
          ${roll > 0
            ? `<tr><td style="padding:3px 8px 3px 0;color:#1a7a1a">🏆 Rolled → team &#128274;</td><td class="money" style="text-align:right">$${roll}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${rollPct}% of pot</td></tr>`
            : hd.unclaimed > 0
              ? `<tr><td style="padding:3px 8px 3px 0;color:#b07000">⏳ Pending (unclaimed)</td><td style="text-align:right;color:#b07000">$${hd.unclaimed}</td><td style="color:#aaa;font-size:.85em;padding-left:8px">${pendingPct}% of pot</td></tr>`

          <tr style="border-top:1px solid var(--border)"><td style="padding:5px 8px 3px 0;color:#666">Total accounted</td><td style="text-align:right"><strong>$${allocated}</strong></td><td style="color:#aaa;font-size:.85em;padding-left:8px">${claimedPct + rollPct}%</td></tr>

      return `<div${day === 'day1' ? ' style="margin-bottom:18px"' : ''}>
        <div style="font-weight:bold;margin-bottom:4px">⛳ ${dayLabel} &mdash; $400</div>
        ${pctBar(allocated, 400, 'var(--green)')}
        <details style="margin-top:2px">${detailsSummary}${detailRows}
        </details>
      </div>`;
    }).join('')}

    </div></div>`;

  // ── Player Winnings Table — scoreboard order, money columns only ──
  const mc = v => v ? `<strong class="money">$${v}</strong>` : `<span style="color:#ddd">—</span>`;

  html += `<div class="card">
    <div class="card-header">💵 Player Winnings</div>
    <div class="card-body" style="padding:0">
      <table class="sb-table" style="width:100%"><thead><tr>
        <th class="c" style="width:36px"></th>
        <th>Player</th>
        <th class="c">Holes</th>
        <th class="c">Team</th>
        <th class="c">Finish</th>
        <th class="c">💰 Total</th>
      </tr></thead><tbody>`;

  let prevRk = null, dispRk = 1;
  ranked.forEach((p, i) => {
    if (p.total !== prevRk) dispRk = i + 1;
    prevRk = p.total;
    const fm = finishPrize(p.name);

    const holeMoney = p.d1.money + p.d2.money;

    html += `<tr${dispRk <= 3 ? ' class="winner"' : ''}>

    </tr>`;
  });

  html += `</tbody></table></div></div>`;
  el.innerHTML = html;
}

function renderAnalytics() {
  const el = document.getElementById('pane-analytics');
  const all26  = allPlayerStats();
  const tt     = teamTotals();
  const anyScores = all26.some(p => p.total > 0);
  const t1col  = S.teams.t1.color;
  const t2col  = S.teams.t2.color;
  const t1name = esc(S.teams.t1.name);
  const t2name = esc(S.teams.t2.name);

  // Per-category team totals
  const tb = { t1:{four:0,match:0,rank:0,pay:0}, t2:{four:0,match:0,rank:0,pay:0} };
  all26.forEach(p => {
    if (!p.team || !tb[p.team]) return;
    tb[p.team].four  += p.d1.fourMan   + p.d2.fourMan;
    tb[p.team].match += p.d1.matchWin  + p.d2.matchWin;
    tb[p.team].rank  += p.d1.matchRank + p.d2.matchRank;
    tb[p.team].pay   += p.d1.payout    + p.d2.payout;
  });

  // Category leaders (2026 live)
  const catLeader = fn => {
    const max = Math.max(...all26.map(fn));
    if (max <= 0) return null;
    return { val: max, players: all26.filter(p => fn(p) === max).map(p => p.name) };
  };
  const fourLead  = catLeader(p => p.d1.fourMan   + p.d2.fourMan);
  const matchLead = catLeader(p => p.d1.matchWin  + p.d2.matchWin);
  const rankLead  = catLeader(p => p.d1.matchRank + p.d2.matchRank);
  const payLead   = catLeader(p => p.d1.payout    + p.d2.payout);
  const surgeLead = catLeader(p => p.d2.total      - p.d1.total);

  const leadStr = (names, max=2) => {
    const shown = names.slice(0,max).map(n => `${flag(n)} ${esc(n)}`).join(', ');
    return shown + (names.length > max ? ` <span style="font-size:.78em;opacity:.7">+${names.length-max}</span>` : '');
  };

  const gradeColor = { A:'#16a34a', B:'#2563eb', C:'#d97706', D:'#ea580c', F:'#dc2626' };
  const withPrev   = PLAYERS.filter(n => PLAYER_META[n].prev);

  let html = '';

  if (!anyScores) {
    html += `<div class="alert alert-gold">&#9971; <strong>No scores entered yet!</strong> The Analytics tab comes to life once Day 1 scoring begins.</div>`;
  }

  /* ── SECTION 1: Team Performance Dashboard ── */
  html += `
  <div class="card">
    <div class="card-header">&#9876;&#65039; 2026 Team Performance Dashboard</div>
    <div class="card-body">`;

  if (!anyScores) {
    html += `<div class="empty"><div class="eicon">&#128202;</div>Waiting for scores&hellip;</div>`;
  } else {
    const aMargin = Math.abs(tt.t1.total - tt.t2.total);
    const aLead   = tt.t1.total > tt.t2.total ? tt.t1.name : tt.t2.total > tt.t1.total ? tt.t2.name : null;
    html += `
    <div class="team-compact-banner" style="margin-bottom:18px">
      <div class="tcb-side" style="background:${t1col}">
        <div class="tcb-name">${t1name}</div>
        <div class="tcb-score">${fmt(tt.t1.total)}</div>
        <div style="font-size:.7em;opacity:.7;margin-top:2px">D1: ${fmt(tt.t1.d1)} &middot; D2: ${fmt(tt.t1.d2)}</div>
      </div>
      <div class="tcb-mid">
        <div class="tcb-vs">VS</div>
        <div class="tcb-margin">${aLead ? `${esc(aLead)} +${fmt(aMargin)}` : 'Tied'}</div>
      </div>
      <div class="tcb-side" style="background:${t2col}">
        <div class="tcb-name">${t2name}</div>
        <div class="tcb-score">${fmt(tt.t2.total)}</div>
        <div style="font-size:.7em;opacity:.7;margin-top:2px">D1: ${fmt(tt.t2.d1)} &middot; D2: ${fmt(tt.t2.d2)}</div>
      </div>
    </div>`;

    const cats = [
      { label:'4-Man Scramble', t1v:tb.t1.four,  t2v:tb.t2.four  },
      { label:'Match Win Pts',  t1v:tb.t1.match, t2v:tb.t2.match },
      { label:'Rank Pts',       t1v:tb.t1.rank,  t2v:tb.t2.rank  },
      { label:'Hole Payouts',   t1v:tb.t1.pay,   t2v:tb.t2.pay   },
    ];
    html += `<div>`;
    cats.forEach(c => {
      const total = c.t1v + c.t2v || 1;
      const t1pct = Math.round(c.t1v / total * 100);
      html += `
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:.84em">
          <span style="font-weight:bold;color:${t1col}">${fmt(c.t1v)} pts${c.t1v>c.t2v?' &laquo;':''}</span>
          <span style="color:var(--gray)">${c.label}</span>
          <span style="font-weight:bold;color:${t2col}">${c.t2v>c.t1v?'&raquo; ':''}${fmt(c.t2v)} pts</span>
        </div>
        <div style="display:flex;height:11px;border-radius:5px;overflow:hidden;background:#e5e7eb">
          <div style="width:${t1pct}%;background:${t1col};transition:width .4s"></div>
          <div style="width:${100-t1pct}%;background:${t2col};transition:width .4s"></div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div></div>`;

  /* ── SECTION 2: Who's Producing ── */
  html += `
  <div class="card">
    <div class="card-header">&#128170; Who&rsquo;s Producing &mdash; Player Contributions</div>
    <div class="card-body">`;

  if (!anyScores) {
    html += `<div class="empty"><div class="eicon">&#127948;</div>Waiting for scores&hellip;</div>`;
  } else {
    ['t1','t2'].forEach(tk => {
      const tPlayers = all26.filter(p => p.team === tk).sort((a,b) => b.total - a.total);
      const tTotal   = tt[tk].total || 1;
      const tname    = esc(S.teams[tk].name);
      const tcol     = S.teams[tk].color;
      html += `<div style="margin-bottom:22px">
        <div style="font-weight:bold;color:white;background:${tcol};padding:7px 13px;border-radius:6px;margin-bottom:10px;font-size:.88em;letter-spacing:.3px">${tname}</div>`;
      tPlayers.forEach(p => {
        const pct = Math.round(p.total / tTotal * 100);
        html += `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
          <div style="min-width:88px;font-size:.86em;font-weight:bold;white-space:nowrap">${flag(p.name)} ${esc(p.name)}</div>
          <div style="flex:1;height:20px;background:#e5e7eb;border-radius:5px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${tcol};border-radius:5px;display:flex;align-items:center;padding-left:7px;font-size:.7em;color:white;font-weight:bold;transition:width .4s;white-space:nowrap">
              ${pct >= 10 ? pct+'%' : ''}
            </div>
          </div>
          <div style="min-width:60px;text-align:right;font-size:.84em">
            <strong class="pts">${fmt(p.total)}</strong> <span style="color:#bbb;font-size:.82em">${pct}%</span>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
  }
  html += `</div></div>`;

  /* ── SECTION 3: Category Leaders ── */
  html += `
  <div class="card">
    <div class="card-header">&#127941; 2026 Category Leaders</div>
    <div class="card-body">`;

  if (!anyScores) {
    html += `<div class="empty"><div class="eicon">&#127919;</div>Waiting for scores&hellip;</div>`;
  } else {
    const lCard = (icon, label, leader) => {
      if (!leader) return `<div class="highlight-card"><div class="hc-label">${icon} ${label}</div><div class="hc-name" style="opacity:.45">&mdash;</div><div class="hc-val">No data yet</div></div>`;
      return `<div class="highlight-card"><div class="hc-label">${icon} ${label}</div><div class="hc-name">${leadStr(leader.players)}</div><div class="hc-val">${leader.val} pts</div></div>`;
    };
    html += `<div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(145px,1fr))">
      ${lCard('&#9971;&#65039;','4-Man King',   fourLead)}
      ${lCard('&#129354;','Match Dominator', matchLead)}
      ${lCard('&#127941;','Rank Pts Leader', rankLead)}
      ${lCard('&#128176;','Payout King',  payLead)}
      ${lCard('&#128640;','Day 2 Surge',  surgeLead)}
    </div>`;
  }
  html += `</div></div>`;

  /* ── SECTION 4: Stacked bar chart ── */
  html += `
  <div class="card">
    <div class="card-header">&#128202; 2026 Points Breakdown &mdash; Visual</div>
    <div class="card-body">`;

  if (!anyScores) {
    html += `<div class="empty"><div class="eicon">&#128202;</div>Waiting for scores&hellip;</div>`;
  } else {
    const sorted26 = [...all26].sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
    const maxPts = Math.max(...sorted26.map(p => p.total), 1);
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:.78em;align-items:center">
      <span><span style="display:inline-block;width:12px;height:12px;background:#16a34a;border-radius:2px;margin-right:4px;vertical-align:middle"></span>4-Man</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#2563eb;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Match Win</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--gold);border-radius:2px;margin-right:4px;vertical-align:middle"></span>Rank Pts</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#e05555;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Payouts</span>
    </div>`;
    sorted26.forEach(p => {
      const f = p.d1.fourMan+p.d2.fourMan, m = p.d1.matchWin+p.d2.matchWin,
            r = p.d1.matchRank+p.d2.matchRank, y = p.d1.payout+p.d2.payout;
      const fp=f/maxPts*100, mp=m/maxPts*100, rp=r/maxPts*100, yp=y/maxPts*100;
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
        <div style="min-width:82px;font-size:.83em;font-weight:bold;white-space:nowrap;text-align:right">${flag(p.name)} ${esc(p.name)}</div>
        <div style="flex:1;height:22px;border-radius:4px;overflow:hidden;background:#f0f0f0;display:flex">
          ${f>0?`<div style="width:${fp.toFixed(1)}%;background:#16a34a;height:100%" title="4-Man: ${f}"></div>`:''}
          ${m>0?`<div style="width:${mp.toFixed(1)}%;background:#2563eb;height:100%" title="Match Win: ${m}"></div>`:''}
          ${r>0?`<div style="width:${rp.toFixed(1)}%;background:var(--gold);height:100%" title="Rank Pts: ${r}"></div>`:''}
          ${y>0?`<div style="width:${yp.toFixed(1)}%;background:#e05555;height:100%" title="Payouts: ${y}"></div>`:''}
        </div>
        <div style="min-width:34px;text-align:right;font-size:.83em;font-weight:bold;color:var(--green)">${fmt(p.total)}</div>
      </div>`;
    });
  }
  html += `</div></div>`;

  /* ── SECTION 4b: Day 1 → Day 2 Progression ── */
  html += `
  <div class="card">
    <div class="card-header">&#128336; Day 1 &rarr; Day 2 Progression</div>
    <div class="card-body">`;

  if (!anyScores) {
    html += `<div class="empty"><div class="eicon">&#9200;</div>Waiting for scores&hellip;</div>`;
  } else {
    const hasD2 = all26.some(p => p.d2.total > 0);
    if (!hasD2) {
      html += `<div class="alert alert-info" style="margin-bottom:12px">Day 2 scores not entered yet &mdash; this chart fills in after Day 2 is played.</div>`;
    }
    const sorted26d = [...all26].sort((a,b) => b.total - a.total);
    const maxDay = Math.max(...sorted26d.map(p => Math.max(p.d1.total, p.d2.total)), 1);
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:.78em;align-items:center">
      <span><span style="display:inline-block;width:20px;height:4px;background:var(--green);border-radius:2px;margin-right:4px;vertical-align:middle"></span>Day 1</span>
      <span><span style="display:inline-block;width:20px;height:4px;background:var(--gold);border-radius:2px;margin-right:4px;vertical-align:middle"></span>Day 2</span>
    </div>`;
    sorted26d.forEach(p => {
      const d1p = (p.d1.total/maxDay*100).toFixed(1);
      const d2p = (p.d2.total/maxDay*100).toFixed(1);
      const delta = p.d2.total - p.d1.total;
      const dStr = !hasD2 ? '' : delta>0
        ? `<span style="color:var(--green);font-size:.75em;font-weight:bold">+${fmt(delta)}</span>`
        : delta<0
          ? `<span style="color:#b03030;font-size:.75em;font-weight:bold">${fmt(delta)}</span>`
          : `<span style="color:#aaa;font-size:.75em">&mdash;</span>`;
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
        <div style="min-width:82px;font-size:.83em;font-weight:bold;white-space:nowrap;text-align:right">${flag(p.name)} ${esc(p.name)}</div>
        <div style="flex:1">
          <div style="height:9px;background:var(--green);border-radius:3px;width:${d1p}%;margin-bottom:2px;opacity:.85"></div>
          <div style="height:9px;background:var(--gold);border-radius:3px;width:${d2p}%;opacity:.9"></div>
        </div>
        <div style="min-width:90px;font-size:.8em;display:flex;gap:5px;align-items:center">
          <span style="color:var(--green)">${fmt(p.d1.total)}</span>
          <span style="color:#ccc">|</span>
          <span style="color:var(--gold-dark)">${fmt(p.d2.total)}</span>
          ${dStr}
        </div>
      </div>`;
    });
  }
  html += `</div></div>`;

  /* ── SECTION 5: Player Ratings (placeholder) ── */
  const bySkill = [...PLAYERS].filter(n => PLAYER_META[n].skill !== null)
    .sort((a,b) => PLAYER_META[b].skill - PLAYER_META[a].skill);
  html += `
  <div class="card">
    <div class="card-header">&#127919; Player Ratings <span style="font-size:.78em;font-weight:normal;opacity:.7">(Pre-Tournament Reference)</span></div>
    <div class="card-body">
      <div class="alert alert-info" style="margin-bottom:12px">
        Static pre-tournament ratings. <strong>Bode Grade</strong> = overall GBI performance history &nbsp;&middot;&nbsp; <strong>Skill</strong> and <strong>Vibes</strong> out of 10.
      </div>
      <table><thead><tr>
        <th>Player</th><th class="c hide-mobile">Team</th>
        <th class="c">Bode Grade</th><th>Skill</th><th>Vibes</th>
      </tr></thead><tbody>`;
  bySkill.forEach(n => {
    const m = PLAYER_META[n], gc = gradeColor[m.grade] || '#888';
    const bar = (val, col) => `<div style="display:flex;align-items:center;gap:6px">
      <div style="flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;min-width:60px">
        <div style="height:100%;width:${val*10}%;background:${col};border-radius:4px"></div>
      </div>
      <span style="font-size:.8em;font-weight:bold;color:${col};min-width:26px">${val}</span>
    </div>`;
    html += `<tr>
      <td><strong>${flag(n)} ${esc(n)}</strong></td>
      <td class="c hide-mobile">${tBadge(teamOf(n))}</td>
      <td class="c"><span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:${gc};color:white;font-weight:bold;font-size:.9em">${m.grade}</span></td>
      <td style="min-width:100px">${bar(m.skill,'var(--green)')}</td>
      <td style="min-width:100px">${bar(m.vibes,'var(--gold-dark)')}</td>
    </tr>`;
  });
  html += `<tr>
    <td><strong>${flag('Braden')} Braden</strong> <span style="font-size:.7em;background:var(--gold);color:white;padding:1px 6px;border-radius:8px;font-weight:bold">ROOKIE</span></td>
    <td class="c hide-mobile">${tBadge(teamOf('Braden'))}</td>
    <td class="c" style="color:#aaa">&mdash;</td>
    <td colspan="2" style="color:#aaa;font-style:italic;font-size:.85em">First year &mdash; ratings TBD</td>
  </tr></tbody></table></div></div>`;

  /* ── SECTION 6: 2025 Historical (compact reference) ── */
  const sorted25 = [...withPrev].sort((a,b) => PLAYER_META[a].prev.rank - PLAYER_META[b].prev.rank);
  html += `
  <div class="card">
    <div class="card-header">&#128220; 2025 Final Results &mdash; Reference</div>
    <div class="card-body">
      <div class="alert alert-gold" style="margin-bottom:12px">
        <strong>2025 Champions: Team Bode</strong> (370.5 &ndash; 291.5) &nbsp;&middot;&nbsp; Individual champion: ${flag('Nail')} Nail (51.5 pts)
      </div>
      <table><thead><tr>
        <th class="c">#</th><th>Player</th>
        <th class="c hide-mobile">Team</th><th class="c">Pts</th><th class="c">Won</th>
      </tr></thead><tbody>`;
  sorted25.forEach(n => {
    const p = PLAYER_META[n].prev;
    html += `<tr${p.rank<=3?' class="winner"':''}>
      <td class="c"><span class="rank${p.rank<=3?' gold':''}">${p.rank}</span></td>
      <td><strong>${flag(n)} ${esc(n)}</strong></td>
      <td class="c hide-mobile">${tBadge(teamOf(n))}</td>
      <td class="c pts">${p.total}</td>
      <td class="c money">$${p.d1m + p.d2m}</td>
    </tr>`;
  });
  html += `<tr>
    <td class="c" style="color:#aaa">&mdash;</td>
    <td><strong>${flag('Braden')} Braden</strong> <span style="font-size:.7em;background:var(--gold);color:white;padding:1px 6px;border-radius:8px;font-weight:bold">ROOKIE</span></td>
    <td class="c hide-mobile">${tBadge(teamOf('Braden'))}</td>
    <td class="c" style="color:#aaa">&mdash;</td><td class="c" style="color:#aaa">&mdash;</td>
  </tr></tbody></table></div></div>`;

  el.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════ */
boot();
setInterval(() => { if (_cur === 'scoreboard' && TOURNEY_DATE - new Date() > 0) renderScoreboard(); }, 1000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
